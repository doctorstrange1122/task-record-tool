  /* 周期性检查：到点的提醒弹窗；稍后提醒到点再次触发 */
  function checkReminders() {
    var now = Date.now();
    var fired = loadFiredReminders();
    var snoozes = loadSnoozes();
    var dirty = false;

    Object.keys(snoozes).forEach(function (key) {
      if (snoozes[key] > now) return;
      var rid = key.split('|')[1];
      var found = null;
      data.accounts.some(function (acc) {
        return acc.categories.some(function (cat) {
          return cat.tasks.some(function (t) {
            var hit = (t.reminders || []).some(function (rr) { return rr.id === rid; });
            if (hit) { found = { task: t, r: (t.reminders || []).filter(function (rr) { return rr.id === rid; })[0] }; return true; }
            return false;
          });
        });
      });
      delete snoozes[key];
      dirty = true;
      if (found) fireReminder(found.task, found.r);
    });

    data.accounts.forEach(function (acc) {
      acc.categories.forEach(function (cat) {
        cat.tasks.forEach(function (t) {
          if (!t.configured || !t.reminders || !t.reminders.length) return;
          t.reminders.forEach(function (r) {
            if (r.enabled === false) return;
            var occ = recentOccurrence(r, t, now);
            if (!occ) return;
            var key = t.id + '|' + r.id + '|' + occ;
            if (fired[key]) return;
            fired[key] = now;
            dirty = true;
            fireReminder(t, r);
          });
        });
      });
    });

    if (dirty) { saveFiredReminders(fired); saveSnoozes(snoozes); }
  }

  function openCountDialog(task) {
    var value = task.count;
    openModal(function (sheet, close) {
      var h = document.createElement('h3');
      h.textContent = '调整次数 · ' + task.name;
      sheet.appendChild(h);
      var p = document.createElement('p');
      p.className = 'hint';
      p.textContent = '当前统计周期内的完成次数';
      sheet.appendChild(p);

      var row = document.createElement('div');
      row.className = 'counter-row';
      var minus = document.createElement('button');
      minus.type = 'button';
      minus.className = 'counter-btn';
      minus.textContent = '−';
      var input = document.createElement('input');
      input.type = 'number';
      input.className = 'counter-val';
      input.value = String(value);
      input.min = '0';
      input.max = String(MAX_COUNT);
      input.inputMode = 'numeric';
      var plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'counter-btn';
      plus.textContent = '+';

      function setValue(n) {
        value = Math.max(0, Math.min(MAX_COUNT, n));
        input.value = String(value);
      }
      minus.addEventListener('click', function () { setValue(value - 1); });
      plus.addEventListener('click', function () { setValue(value + 1); });
      input.addEventListener('input', function () {
        var n = parseInt(input.value, 10);
        if (!isNaN(n)) value = Math.max(0, Math.min(MAX_COUNT, n));
      });
      row.appendChild(minus);
      row.appendChild(input);
      row.appendChild(plus);
      sheet.appendChild(row);

      var actions = document.createElement('div');
      actions.className = 'sheet-actions';
      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'btn btn-ghost';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', close);
      var okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'btn btn-primary';
      okBtn.textContent = '确定';
      okBtn.addEventListener('click', function () {
        var n = parseInt(input.value, 10);
        var finalVal = isNaN(n) ? 0 : Math.max(0, Math.min(MAX_COUNT, n));
        task.count = finalVal;
        if (finalVal > 0 && (task.cycleStart === 0 || Date.now() >= resetAt(task))) {
          task.cycleStart = Date.now();
        }
        if (finalVal === 0) task.cycleStart = 0;
        save();
        render();
        close();
        toast('次数已调整为 ' + finalVal);
      });
      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);
      sheet.appendChild(actions);

      setTimeout(function () { try { input.focus(); input.select(); } catch (e) {} }, 60);
    });
  }

  /* ================= 登录 / 注册 ================= */
  function openAuthModal(initialMode) {
    if (!apiConfigured()) {
      openModal(function (sheet, close) {
        var h = document.createElement('h3');
        h.textContent = '云同步未配置';
        sheet.appendChild(h);
        var p = document.createElement('p');
        p.className = 'hint';
        p.textContent = '云同步服务地址尚未配置，暂时无法登录。本机功能可正常使用，数据保存在本机浏览器。';
        sheet.appendChild(p);
        var ok = document.createElement('button');
        ok.type = 'button';
        ok.className = 'btn btn-primary';
        ok.textContent = '知道了';
        ok.style.width = '100%';
        ok.style.marginTop = '12px';
        ok.addEventListener('click', close);
        sheet.appendChild(ok);
      });
      return;
    }

    var mode = initialMode || 'login';
    openModal(function (sheet, close) {
      var inputs = {};
      var errEl = document.createElement('p');
      errEl.className = 'hint';
      errEl.style.color = 'var(--danger)';
      errEl.style.display = 'none';
      errEl.style.marginBottom = '0';

      function showErr(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }
      function hideErr() { errEl.style.display = 'none'; }

      function field(key, label, type) {
        var wrap = document.createElement('div');
        wrap.className = 'field';
        var l = document.createElement('label');
        l.textContent = label;
        wrap.appendChild(l);
        var input = document.createElement('input');
        input.type = type;
        if (type === 'password') input.autocomplete = 'new-password';
        wrap.appendChild(input);
        inputs[key] = input;
        return wrap;
      }

      function render() {
        sheet.innerHTML = '';
        var h = document.createElement('h3');
        h.textContent = mode === 'login' ? '登录账号' : '注册账号';
        sheet.appendChild(h);
        var tip = document.createElement('p');
        tip.className = 'hint';
        tip.style.marginBottom = '12px';
        tip.textContent = mode === 'login'
          ? '登录后自动同步该账号在所有设备上的任务'
          : '注册后会自动把本机已设置的任务同步到新账号';
        sheet.appendChild(tip);
        sheet.appendChild(field('username', mode === 'register' ? '账号（7-11 位数字）' : '账号（7-11 位数字）', 'text'));
        inputs.username.inputMode = 'numeric';
        inputs.username.autocomplete = 'username';
        if (mode === 'register') {
          sheet.appendChild(field('nickname', '昵称（1-20 个字符）', 'text'));
          inputs.nickname.autocomplete = 'nickname';
        }
        sheet.appendChild(field('password', '密码（至少 6 位）', 'password'));
        if (mode === 'register') sheet.appendChild(field('confirm', '确认密码', 'password'));
        sheet.appendChild(errEl);
        var actions = document.createElement('div');
        actions.className = 'sheet-actions';
        actions.style.marginTop = '12px';
        var cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn btn-ghost';
        cancelBtn.textContent = '取消';
        cancelBtn.addEventListener('click', close);
        var okBtn = document.createElement('button');
        okBtn.type = 'button';
        okBtn.className = 'btn btn-primary';
        okBtn.textContent = mode === 'login' ? '登录' : '注册';
        okBtn.addEventListener('click', submit);
        actions.appendChild(cancelBtn);
        actions.appendChild(okBtn);
        sheet.appendChild(actions);
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.style.cssText = 'width:100%;margin-top:10px;border:none;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:6px;';
        toggle.textContent = mode === 'login' ? '没有账号？立即注册' : '已有账号？去登录';
        toggle.addEventListener('click', function () {
          mode = mode === 'login' ? 'register' : 'login';
          render();
        });
        sheet.appendChild(toggle);
        setTimeout(function () { try { inputs.username.focus(); } catch (e) {} }, 60);
      }

      function submit() {
        hideErr();
        var username = (inputs.username.value || '').trim();
        var nickname = inputs.nickname ? (inputs.nickname.value || '').trim() : '';
        var password = inputs.password.value || '';
        var confirmPw = inputs.confirm ? (inputs.confirm.value || '') : password;
        if (!/^\d{7,11}$/.test(username)) { showErr('账号须为 7-11 位数字'); return; }
        if (mode === 'register' && (nickname.length < 1 || nickname.length > 20)) { showErr('昵称须为 1-20 个字符'); return; }
        if (password.length < 6) { showErr('密码长度至少 6 位'); return; }
        if (mode === 'register' && password !== confirmPw) { showErr('两次输入的密码不一致'); return; }
        var okBtn = sheet.querySelector('.btn-primary');
        okBtn.disabled = true;
        okBtn.textContent = '提交中…';
        doAuth(mode, username, password, nickname).then(function (msg) {
          close();
          toast(msg);
        }).catch(function (err) {
          showErr((err && err.message) || '操作失败，请重试');
          okBtn.disabled = false;
          okBtn.textContent = mode === 'login' ? '登录' : '注册';
        });
      }

      render();
    });
  }

  /* ================= 账号 Tab ================= */
  function openAddAccountDialog() {
    var defName = '账号' + (data.accounts.length + 1);
    var options = [{ value: '', label: '不复制（空白账号）' }];
    data.accounts.forEach(function (a) {
      options.push({ value: a.id, label: '复制自：' + a.name });
    });
    openFormDialog({
      title: '添加账号',
      fields: [
        { key: 'name', label: '账号名称', type: 'text', value: defName, placeholder: defName },
        { key: 'copyFrom', label: '复制已有账号的任务', type: 'select', value: '', options: options }
      ],
      confirmText: '创建',
      onConfirm: function (v) {
        var name = (v.name || '').trim() || defName;
        var acc = { id: genId(), name: name, categories: [] };
        var src = null;
        if (v.copyFrom) {
          data.accounts.forEach(function (a) { if (a.id === v.copyFrom) src = a; });
        }
        if (src) {
          /* 深拷贝任务结构，次数与周期进度归零 */
          src.categories.forEach(function (cat) {
            var nc = { id: genId(), name: cat.name, tasks: [] };
            cat.tasks.forEach(function (t) {
              var nt = newTask();
              nt.configured = t.configured;
              nt.name = t.name;
              nt.cycleDays = t.cycleDays;
              nt.reminders = JSON.parse(JSON.stringify(t.reminders || []));
              nc.tasks.push(nt);
            });
            acc.categories.push(nc);
          });
        }
        if (!acc.categories.length) {
          acc.categories.push({ id: genId(), name: '默认分类', tasks: [] });
        }
        data.accounts.push(acc);
        data.activeAccountId = acc.id;
        save();
        render();
        toast('已创建「' + name + '」');
      }
    });
  }

  function openAccountMenu(acc) {
    openMenuDialog('管理账号 · ' + acc.name, [
      {
        label: '重命名',
        onClick: function () {
          openFormDialog({
            title: '重命名账号',
            fields: [{ key: 'name', label: '账号名称', type: 'text', value: acc.name }],
            confirmText: '保存',
            onConfirm: function (v) {
              var name = (v.name || '').trim();
              if (!name) { toast('请输入账号名称'); return false; }
              acc.name = name;
              save();
              render();
              toast('已重命名');
            }
          });
        }
      },
      {
        label: '删除账号',
        danger: true,
        onClick: function () {
          if (data.accounts.length <= 1) { toast('至少需要保留一个账号'); return; }
          openConfirmDialog('删除账号', '确定删除「' + acc.name + '」及其所有任务吗？', function () {
            var i = data.accounts.indexOf(acc);
            if (i > -1) data.accounts.splice(i, 1);
            if (data.activeAccountId === acc.id) data.activeAccountId = data.accounts[0].id;
            save();
            render();
            toast('账号已删除');
          });
        }
      }
    ]);
  }

  /* ================= 分类 ================= */
  function openCategoryMenu(cat) {
    openMenuDialog('管理分类 · ' + cat.name, [
      {
        label: '重命名分类',
        onClick: function () {
          openFormDialog({
            title: '重命名分类',
            fields: [{ key: 'name', label: '分类名称', type: 'text', value: cat.name }],
            confirmText: '保存',
            onConfirm: function (v) {
              var name = (v.name || '').trim();
              if (!name) { toast('请输入分类名称'); return false; }
              cat.name = name;
              save();
              render();
            }
          });
        }
      },
      {
        label: '添加 / 管理子分类',
        onClick: function () { openSubcatManager(cat); }
      },
      {
        label: '删除分类',
        danger: true,
        onClick: function () {
          openConfirmDialog('删除分类', '确定删除「' + cat.name + '」及其下所有任务吗？', function () {
            var acc = activeAccount();
            var i = acc.categories.indexOf(cat);
            if (i > -1) acc.categories.splice(i, 1);
            if (!acc.categories.length) {
              acc.categories.push({ id: genId(), name: '默认分类', tasks: [] });
            }
            save();
            render();
            toast('分类已删除');
          });
        }
      }
    ]);
  }

  function openAddCategoryDialog() {
    openFormDialog({
      title: '添加分类',
      fields: [{ key: 'name', label: '分类名称', type: 'text', value: '', placeholder: '例如：工作 / 学习 / 每日打卡' }],
      confirmText: '添加',
      onConfirm: function (v) {
        var name = (v.name || '').trim();
        if (!name) { toast('请输入分类名称'); return false; }
        activeAccount().categories.push({ id: genId(), name: name, tasks: [] });
        save();
        render();
      }
    });
  }

  /* ================= 子分类管理 ================= */
  function openSubcatManager(cat) {
    if (!Array.isArray(cat.subcats)) cat.subcats = [];
    openModal(function (sheet, close) {
      var h = document.createElement('h3');
      h.textContent = '子分类 · ' + cat.name;
      sheet.appendChild(h);

      var tip = document.createElement('div');
      tip.className = 'subcat-tip';
      tip.textContent = '拖动 ≡ 可调整子分类顺序，其下任务会跟随移动。';
      sheet.appendChild(tip);

      var list = document.createElement('div');
      list.className = 'subcat-list';
      sheet.appendChild(list);

      function commitOrder() {
        var rows = Array.prototype.slice.call(list.querySelectorAll('.subcat-row'));
        var ids = rows.map(function (r) { return r.dataset.sid; });
        cat.subcats.sort(function (a, b) { return ids.indexOf(a.id) - ids.indexOf(b.id); });
        save();
      }

      function attachRowDrag(grip, row) {
        function rowAt(y) {
          var rows = Array.prototype.slice.call(list.querySelectorAll('.subcat-row'));
          for (var i = 0; i < rows.length; i++) {
            if (rows[i] === row) continue;
            var r = rows[i].getBoundingClientRect();
            if (y < r.top + r.height / 2) return rows[i];
          }
          return null;
        }
        function move(y) {
          var ref = rowAt(y);
          if (ref) { if (row.nextSibling !== ref) list.insertBefore(row, ref); }
          else if (list.lastChild !== row) list.appendChild(row);
        }
        function up() {
          document.removeEventListener('touchmove', tmv);
          document.removeEventListener('touchend', up);
          document.removeEventListener('touchcancel', up);
          document.removeEventListener('mousemove', mmv);
          document.removeEventListener('mouseup', up);
          row.classList.remove('dragging');
          commitOrder();
        }
        function tmv(e) { if (e.touches.length !== 1) return; e.preventDefault(); move(e.touches[0].clientY); }
        function mmv(e) { move(e.clientY); }
        function down(y) {
          row.classList.add('dragging');
          document.addEventListener('touchmove', tmv, { passive: false });
          document.addEventListener('touchend', up);
          document.addEventListener('touchcancel', up);
          document.addEventListener('mousemove', mmv);
          document.addEventListener('mouseup', up);
          move(y);
        }
        grip.addEventListener('touchstart', function (e) {
          e.preventDefault();
          down(e.touches[0].clientY);
        }, { passive: false });
        grip.addEventListener('mousedown', function (e) {
          if (e.button !== 0) return;
          e.preventDefault();
          down(e.clientY);
        });
      }

      function renderRows() {
        list.innerHTML = '';
        if (!cat.subcats.length) {
          var empty = document.createElement('div');
          empty.className = 'subcat-empty';
          empty.textContent = '还没有子分类，点击下方按钮添加';
          list.appendChild(empty);
          return;
        }
        cat.subcats.forEach(function (sc) {
          var isUng = sc.id === UNG_ID;
          var row = document.createElement('div');
          row.className = 'subcat-row';
          row.dataset.sid = sc.id;
          var grip = document.createElement('span');
          grip.className = 'grip';
          grip.textContent = '≡';
          grip.title = '拖动排序';
          var input = document.createElement('input');
          input.type = 'text';
          input.value = sc.name;
          input.placeholder = '子分类名称';
          input.addEventListener('input', function () { sc.name = input.value; });
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'mini-del';
          del.textContent = '✕';
          del.title = '删除子分类';
          del.addEventListener('click', function () {
            var i = cat.subcats.indexOf(sc);
            if (i > -1) cat.subcats.splice(i, 1);
            cat.tasks.forEach(function (t) { if (t.subId === sc.id) t.subId = null; });
            renderRows();
            save();
          });
          if (isUng) del.style.visibility = 'hidden';
          row.appendChild(grip);
          row.appendChild(input);
          row.appendChild(del);
          list.appendChild(row);
          attachRowDrag(grip, row);
        });
      }
      renderRows();

      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'subcat-add';
      addBtn.textContent = '+ 添加子分类';
      addBtn.addEventListener('click', function () {
        var realCount = cat.subcats.filter(function (s) { return s.id !== UNG_ID; }).length;
        var sc = { id: genId(), name: '' };
        cat.subcats.push(sc);
        if (!realCount) {
          /* 第一个真实子分类接管原本的「未分组」默认区域：原默认任务归入该子分类 */
          var ids = {};
          cat.subcats.forEach(function (s) { ids[s.id] = true; });
          cat.tasks.forEach(function (t) { if (!t.subId || !ids[t.subId]) t.subId = sc.id; });
        }
        renderRows();
        var inputs = list.querySelectorAll('.subcat-row input');
        if (inputs.length) { try { inputs[inputs.length - 1].focus(); } catch (e) {} }
      });
      sheet.appendChild(addBtn);

      var actions = document.createElement('div');
      actions.className = 'sheet-actions';
      var done = document.createElement('button');
      done.type = 'button';
      done.className = 'btn btn-primary';
      done.textContent = '完成';
      done.addEventListener('click', function () {
        cat.subcats = cat.subcats.filter(function (s) {
          if (s.id === UNG_ID) { s.name = (s.name || '').trim() || '未分组'; return true; }
          return (s.name || '').trim();
        });
        cat.subcats.forEach(function (s) { if (s.id !== UNG_ID) s.name = s.name.trim(); });
        save();
        close();
        render();
      });
      actions.appendChild(done);
      sheet.appendChild(actions);
    }, { dismissOnMask: true });
  }

  /* ================= Toast ================= */
  var toastTimer = null;
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2000);
  }

  /* ============ 下载 App（安卓 / 鸿蒙） ============ */
  function openAppDownloadDialog() {
    openModal(function (sheet, close) {
      var h = document.createElement('h3');
      h.textContent = '下载 App · 完整提醒';
      sheet.appendChild(h);

      var why = document.createElement('p');
      why.className = 'hint';
      why.style.textAlign = 'left';
      why.innerHTML = '网页版提醒需要页面保持运行；切到后台或关闭后，' +
        '<strong>浏览器会冻结页面的 JS</strong>，这是所有浏览器的安全设计，' +
        '靠系统设置无法解除（华为浏览器更进一步，连网站通知权限都不开放）。<br><br>' +
        '装上 App 后，提醒改由<strong>系统闹钟（AlarmManager）</strong>直接触发通知：' +
        '<br>• 无需保持页面打开<br>• 不依赖 Google 推送服务<br>• 国内网络可正常使用';
      sheet.appendChild(why);

      var dl = document.createElement('button');
      dl.type = 'button';
      dl.textContent = '↓ 下载 APK 安装包';
      dl.style.cssText = 'display:block;text-align:center;margin:12px 0 4px;padding:11px 0;' +
        'border:none;border-radius:10px;background:#FF7A00;color:#fff;' +
        'font-size:14px;font-weight:600;cursor:pointer;';
      dl.addEventListener('click', function () { toast('暂未上线'); });
      sheet.appendChild(dl);

      var note = document.createElement('p');
      note.className = 'hint';
      note.style.textAlign = 'left';
      note.innerHTML = '安装时若提示「未知来源」，选择允许即可。' +
        '装好后打开 App 登录同一账号，任务数据与网页版实时同步。';
      sheet.appendChild(note);

      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn btn-ghost';
      ok.textContent = '关闭';
      ok.style.width = '100%';
      ok.style.marginTop = '10px';
      ok.addEventListener('click', close);
      sheet.appendChild(ok);
    });
  }

  /* ================= 添加到桌面（PWA，全品牌浏览器兼容） ================= */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
  });
  /* 部分浏览器（如鸿蒙）安装成功后不会派发 appinstalled，这里做兜底刷新 */
  window.addEventListener('appinstalled', function () {
    deferredPrompt = null;
    updateInstallBtn();
  });

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function detectBrowser() {
    var ua = navigator.userAgent || '';
    return {
      isIOS: /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
      isHarmony: /HarmonyOS|harmony|ArkWeb|HuaweiBrowser|HUAWEI/i.test(ua),
      isWeixin: /MicroMessenger/i.test(ua),
      isMi: /MiuiBrowser/i.test(ua),
      isOppo: /HeyTapBrowser|OppoBrowser/i.test(ua),
      isVivo: /VivoBrowser/i.test(ua),
      isSamsung: /SamsungBrowser/i.test(ua),
      isAndroid: /Android/i.test(ua)
    };
  }

  function updateInstallBtn() {
    var btn = document.getElementById('installBtn');
    if (!btn) return;
    if (IN_APP) {
      /* App 内运行：添加到桌面无意义，隐藏该按钮 */
      btn.style.display = 'none';
      return;
    }
    if (isStandalone()) {
      /* 不禁用按钮：避免个别浏览器禁用后点击完全无反馈 */
      btn.innerHTML = '<span class="pill-full">✓ 已在桌面运行</span><span class="pill-short">✓ 桌面</span>';
      btn.dataset.standalone = '1';
    }
  }

  /* App 内运行时的界面适配：与网页版做区分 */
  function applyInAppMode() {
    if (!IN_APP) return;
    document.body.classList.add('in-app');
  }

  /* ================= 深色 / 浅色主题 ================= */
  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#17191c' : '#ffffff');
  }
  function initThemeToggle() {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    });
    /* 未手动选择过主题时，跟随系统深浅色变化 */
    var stored = null;
    try { stored = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!stored && window.matchMedia) {
      var mq = matchMedia('(prefers-color-scheme: dark)');
      var onChange = function (e) { applyTheme(e.matches ? 'dark' : 'light'); };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }

  function openInstallHelp() {
    openModal(function (sheet, close) {
      var h = document.createElement('h3');
      h.textContent = '添加到桌面';
      sheet.appendChild(h);
      var img = document.createElement('img');
      img.src = 'icon-192.png';
      img.alt = '任务管理';
      img.style.cssText = 'display:block;width:72px;height:72px;margin:0 auto 12px;border-radius:16px;box-shadow:0 2px 8px rgba(16,24,40,.15);';
      sheet.appendChild(img);
      var p = document.createElement('p');
      p.className = 'hint';
      p.style.textAlign = 'left';
      var b = detectBrowser();
      var html = '';
      if (b.isIOS) {
        html = 'iPhone / iPad（Safari）：<br>1. 点击底部<strong>分享按钮</strong>（□↑）<br>2. 选择「<strong>添加到主屏幕</strong>」<br>3. 点击「添加」，桌面显示名称「<strong>任务管理</strong>」';
      } else if (b.isHarmony) {
        html = '鸿蒙手机（华为/鸿蒙浏览器）：<br>1. 点击浏览器<strong>右下角菜单按钮</strong>（⋮ / ⌄ /「更多」）或底部「工具箱」<br>2. 在弹出面板的「<strong>常用功能</strong>」里点「<strong>＋ 添加至桌面</strong>」<br>3. 确认后桌面显示名称「<strong>任务管理</strong>」<br><br>小提示：各品牌浏览器都不允许网页直接代点这个菜单，需要手动点一次；点过一次后浏览器通常会记住，下次可从桌面直接打开。';
      } else if (b.isWeixin) {
        html = '微信内置浏览器：<br>1. 点击右上角 <strong>⋯</strong><br>2. 选择「<strong>在浏览器中打开</strong>」<br>3. 在浏览器中再次打开本页面，然后按该方法添加到桌面';
      } else if (b.isMi) {
        html = '小米手机（小米浏览器）：<br>1. 点击底部<strong>菜单</strong>（⋮）<br>2. 选择「<strong>添加至桌面</strong>」或「<strong>安装应用</strong>」<br>3. 桌面显示名称「<strong>任务管理</strong>」';
      } else if (b.isOppo || b.isVivo) {
        html = 'OPPO / vivo 手机：<br>1. 点击浏览器<strong>菜单</strong>（⋮）<br>2. 选择「<strong>添加到桌面</strong>」或「<strong>安装应用</strong>」<br>3. 桌面显示名称「<strong>任务管理</strong>」';
      } else if (b.isSamsung) {
        html = '三星手机（三星浏览器）：<br>1. 点击底部<strong>菜单</strong>（☰）<br>2. 选择「<strong>添加到主屏幕</strong>」<br>3. 桌面显示名称「<strong>任务管理</strong>」';
      } else if (b.isAndroid) {
        html = '安卓手机（Chrome 等浏览器）：<br>1. 点击右上角<strong>菜单</strong>（⋮）<br>2. 选择「<strong>安装应用</strong>」或「<strong>添加到主屏幕</strong>」<br>3. 桌面显示名称「<strong>任务管理</strong>」';
      } else {
        html = '电脑浏览器：<br>1. 点击地址栏右侧的<strong>安装图标</strong>（⊕）<br>2. 确认安装，应用名称「<strong>任务管理</strong>」';
      }
      html += '<br><br>找不到对应选项？请在浏览器菜单里查找「添加到桌面 / 添加至主屏幕 / 安装应用 / 桌面快捷方式」等类似入口。';
      p.innerHTML = html;
      sheet.appendChild(p);
      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn btn-primary';
      ok.textContent = '知道了';
      ok.style.width = '100%';
      ok.style.marginTop = '14px';
      ok.addEventListener('click', close);
      sheet.appendChild(ok);
    });
  }

  function bindHeaderButtons() {
    var installBtn = document.getElementById('installBtn');
    installBtn.addEventListener('click', function () {
      if (installBtn.dataset.standalone) { toast('当前已从桌面图标运行'); return; }
      var b = detectBrowser();
      /* 鸿蒙浏览器不弹原生安装框（部分版本无响应），直接给图文指引 */
      if (deferredPrompt && !b.isHarmony) {
        try {
          deferredPrompt.prompt();
          Promise.resolve(deferredPrompt.userChoice).catch(function () {}).then(function () {
            deferredPrompt = null;
          });
          return;
        } catch (e) {
          /* 原生安装不可用时走指引 */
        }
      }
      openInstallHelp();
    });

    var authBtn = document.getElementById('authBtn');
    authBtn.addEventListener('click', function () {
      if (auth) {
        openMenuDialog('云同步 · ' + (auth.nickname || auth.username), [
          {
            label: '立即同步',
            onClick: function () {
              toast('同步请求已发送');
              pullData(false);
              pushData(false);
            }
          },
          {
            label: '下载 App（完整提醒）',
            onClick: function () { openAppDownloadDialog(); }
          },
          {
            label: '退出登录',
            danger: true,
            onClick: function () { logout(); }
          }
        ]);
      } else {
        openAuthModal('login');
      }
    });
  }

  /* ================= 启动 ================= */
  bindHeaderButtons();
  initThemeToggle();
  restoreActiveTab();
  checkCycles();
  if (pruneClipboards()) save();
  render();
  updateAuthUI();
  updateInstallBtn();
  checkReminders();
  if (auth && apiConfigured()) {
    /* 保持登录状态：自动拉取云端最新数据 */
    pullData(false);
  }
  setInterval(function () {
    checkCycles();
    checkReminders();
    if (pruneClipboards()) {
      save();
      if (clipboardView) renderClipboardList();
    }
    if (auth) pullData(true);
  }, 30000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      checkCycles();
      if (auth) pullData(true);
    } else if (syncTimer) {
      /* 切到后台：立即上传待同步数据，避免防抖期内被杀掉 */
      clearTimeout(syncTimer);
      syncTimer = null;
      pushData(true);
    }
  });
  window.addEventListener('pagehide', function () {
    if (syncTimer) {
      clearTimeout(syncTimer);
      syncTimer = null;
      pushData(true);
    }
  });
})();
</script>
