<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>任务管理</title>
<!-- PWA：添加到桌面后显示名称「任务管理」 -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="任务管理" />
<meta name="mobile-web-app-capable" content="yes" />
<script>
  /* 主题初始化：先于渲染执行，避免深浅色闪烁；无手动选择时跟随系统 */
  (function () {
    try {
      var t = localStorage.getItem('taskRecordTool.theme');
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', t === 'dark' ? '#17191c' : '#ffffff');
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --gray: #5c6672;
    --green: #2f9e44;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #212529;
    --muted: #868e96;
    --accent: #339af0;
    --accent-deep: #1c7ed6;
    --danger: #e03131;
    --border: #e9ecef;
    --radius: 14px;
    /* 语义化表面色（深色模式整体覆盖） */
    --header-bg: rgba(255, 255, 255, .94);   /* 顶栏半透明底 */
    --chip-bg: #f1f3f5;                       /* 扁平控件底（tab / 图标按钮 / 计数按钮等） */
    --chip-press: #e9ecef;                    /* 扁平控件按压态 */
    --field-bg: #f8f9fa;                      /* 输入框 / 分段按钮底 */
    --press-bg: #f8f9fa;                      /* 列表项按压态 */
    --divider: #f1f3f5;                       /* 细分隔线 */
    --ok-bg: #edfaf0;                         /* 登录成功 pill 底 */
    --ok-border: #a9d8b6;
    --dashed-border: #97a1ac;                 /* 添加类虚线按钮边框 */
    --dashed-text: #495057;                   /* 添加类虚线按钮文字 */
    --dashed-hover: #eef1f4;                  /* 添加类虚线按钮按压态 */
    --unset-bg: #c3cad2;                      /* 未设置任务按钮 */
    --unset-text: #454e57;
    --unset-border: #8f99a3;
    --bell-bg: rgba(255, 255, 255, .92);      /* 任务按钮内铃铛底 */
    --bell-text: #495057;
    --danger-bg: #fff0f0;                     /* 危险按钮淡红底 */
    --danger-press: #ffe3e3;                  /* 删除按钮按压淡红底 */
    --mask-bg: rgba(15, 23, 42, .45);         /* 弹窗遮罩 */
    --toast-bg: rgba(33, 37, 41, .9);         /* 轻提示 */
    --toast-text: #fff;
  }
  /* ---------- 深色模式 ---------- */
  :root[data-theme="dark"] {
    --bg: #17191c;
    --card: #22262b;
    --text: #e9ecef;
    --muted: #9ba1a9;
    --accent-deep: #1864ab;
    --danger: #ff6b6b;
    --border: #343a40;
    --header-bg: rgba(24, 27, 31, .94);
    --chip-bg: #2c3136;
    --chip-press: #3a4147;
    --field-bg: #262b30;
    --press-bg: #2c3136;
    --divider: #2c3136;
    --ok-bg: rgba(47, 158, 68, .16);
    --ok-border: rgba(47, 158, 68, .48);
    --dashed-border: #5c6672;
    --dashed-text: #c8cdd3;
    --dashed-hover: #2c3136;
    --unset-bg: #3a4147;
    --unset-text: #c8cdd3;
    --unset-border: #5c6672;
    --bell-bg: rgba(30, 34, 38, .92);
    --bell-text: #f1f3f5;
    --danger-bg: rgba(255, 107, 107, .14);
    --danger-press: rgba(255, 107, 107, .2);
    --mask-bg: rgba(0, 0, 0, .62);
    --toast-bg: rgba(233, 236, 239, .94);
    --toast-text: #1a1d21;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; -webkit-touch-callout: none; user-select: none; }
  /* 仅表单控件允许选中文本，便于输入与编辑 */
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  button { font-family: inherit; }

  /* ---------- 顶部：添加到桌面 / 标题 / 登录 ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .head-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 6px;
    padding: calc(9px + env(safe-area-inset-top)) 12px 7px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    text-align: center;
    letter-spacing: .5px;
    white-space: nowrap;
    color: var(--accent);
  }
  .head-pill {
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 0 auto;
  }
  .head-pill:active { background: #2b8de0; }
  .head-pill:disabled { opacity: .6; cursor: default; }
  #installBtn { justify-self: start; }
  #authBtn { justify-self: end; max-width: 36vw; }
  #authBtn.logged {
    color: var(--green);
    border-color: var(--ok-border);
    background: var(--ok-bg);
  }
  #authBtn.logged::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 5px;
    vertical-align: 1px;
  }
  .pill-short { display: none; }
  @media (max-width: 359px) {
    .pill-full { display: none; }
    .pill-short { display: inline; }
  }

  /* ---------- 账号 Tab ---------- */
  .tab-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 12px 10px;
    scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--muted);
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
    max-width: 140px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    user-select: none;
    -webkit-user-select: none;
  }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .tab.add-tab {
    background: var(--card);
    border-style: dashed;
    border-color: var(--dashed-border);
    color: var(--accent);
    font-weight: 700;
    padding: 7px 13px;
  }
  /* 全局：按钮类元素长按时禁止呼出系统复制/选择菜单（兼容 iOS、鸿蒙 ArkWeb） */
  button, .tab, .task-btn, .icon-btn, .head-pill, .cat-name, .cat-sub {
    -webkit-touch-callout: none;
  }

  /* ---------- 跨设备剪贴板 ---------- */
  .clip-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .clip-title { font-size: 15px; font-weight: 700; }
  .clip-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .clip-input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .clip-input {
    flex: 1;
    min-width: 0;
    height: 40px;
    border: 1px solid var(--border);
    background: var(--field-bg);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    outline: none;
    font-family: inherit;
  }
  /* 放大弹窗里的大输入框仍为多行 textarea */
  textarea.clip-input {
    height: auto;
    min-height: 240px;
    resize: none;
  }
  /* 记录容器顶部提示 */
  .clip-copy-hint {
    font-size: 12.5px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  /* 放大编辑弹窗：纵向弹性布局，输入框撑满标题与按钮之间的全部空间 */
  .sheet.clip-edit {
    display: flex;
    flex-direction: column;
    height: min(72vh, 620px);
  }
  .sheet.clip-edit h3 { flex: 0 0 auto; }
  .sheet.clip-edit .clip-input { flex: 1 1 auto; min-height: min(240px, 38vh); }
  .sheet.clip-edit .sheet-actions { flex: 0 0 auto; margin-top: 12px; }
  .clip-input:focus { border-color: var(--accent); background: var(--card); }
  .clip-expand {
    flex: 0 0 auto;
    width: 40px;
    border: 1px solid var(--border);
    background: var(--chip-bg);
    color: var(--muted);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background .15s, color .15s;
  }
  .clip-expand:active { background: var(--chip-press); }
  .clip-expand svg { width: 18px; height: 18px; display: block; }
  .clip-actions {
    display: flex;
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .clip-actions button {
    flex: 1;
    border: none;
    border-radius: 0;
    padding: 10px 0;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: opacity .15s;
  }
  .clip-actions button:active { opacity: .82; }
  .clip-actions button + button { border-left: 1px solid rgba(125, 135, 145, .45); }
  .clip-actions .clip-paste { background: var(--accent); }
  .clip-actions .clip-save { background: var(--green); }
  .clip-actions .clip-clear { background: var(--chip-bg); color: var(--text); }
  .clip-list { margin-top: 12px; }
  .clip-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 4px;
    border-bottom: 1px solid var(--divider);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .clip-item:last-child { border-bottom: none; }
  .clip-item:active { background: var(--press-bg); }
  .clip-idx { font-size: 12px; color: var(--muted); min-width: 18px; flex: 0 0 auto; }
  .clip-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.3;
    word-break: break-all;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .clip-time { font-size: 12px; color: var(--muted); flex: 0 0 auto; }
  .clip-del {
    flex: 0 0 auto;
    border: none;
    background: var(--chip-bg);
    color: var(--muted);
    width: 26px;
    height: 26px;
    border-radius: 999px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .clip-del:active { background: var(--danger-press); color: var(--danger); }
  .clip-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 22px 0; }

  /* ---------- 主体：分类容器 ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 14px 12px 0; }
  .category {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 12px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
  }
  .cat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cat-name { font-size: 15px; font-weight: 700; }
  .cat-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .icon-btn {
    border: none;
    background: var(--chip-bg);
    color: var(--muted);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .icon-btn:active { background: var(--chip-press); }

  /* ---------- 子分类分组 ---------- */
  .subcat-header {
    display: flex;
    align-items: center;
    margin: 14px 2px 2px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }
  .subcat-header::before {
    content: '';
    width: 3px;
    height: 13px;
    border-radius: 2px;
    background: var(--accent);
    margin-right: 7px;
  }

  /* ---------- 子分类管理弹窗 ---------- */
  .subcat-list { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; }
  .subcat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .subcat-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--text);
    padding: 4px 2px;
  }
  .subcat-row input:focus { outline: none; }
  .subcat-row .mini-del {
    border: none;
    background: transparent;
    color: var(--danger);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 6px;
    flex: 0 0 auto;
  }
  .subcat-row .grip {
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
    cursor: grab;
    touch-action: none;
    flex: 0 0 auto;
    padding: 4px 2px;
    user-select: none;
    -webkit-user-select: none;
  }
  .subcat-row.dragging {
    opacity: .8;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .12);
  }
  .subcat-add {
    border: 1px dashed var(--border);
    background: var(--card);
    color: var(--accent);
    border-radius: 10px;
    padding: 9px 0;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .subcat-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 14px 0; }
  .subcat-tip { font-size: 12px; color: var(--muted); margin: 2px 0 10px; }

  /* ---------- 任务按钮拖动（手机桌面风格） ---------- */
  .task-btn.drag-origin {
    visibility: hidden;
  }
  .drag-clone {
    position: fixed;
    z-index: 999;
    pointer-events: none;
    margin: 0;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .28);
    opacity: .96;
    transform: scale(1.06);
    transition: none;
  }
  .task-grid.empty {
    min-height: 56px;
    border: 1.5px dashed var(--border);
    border-radius: 12px;
  }

  /* ---------- 任务按钮（每行 3 个） ---------- */
  .task-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px 8px;
  }
  .task-btn {
    position: relative;
    border: none;
    border-radius: 10px;
    min-height: 40px;
    padding: 4px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    font-size: 12px;
    color: #fff;
    background: var(--gray);
    transition: transform .1s, background .2s;
    user-select: none;
    -webkit-user-select: none;
    overflow: visible;
    word-break: break-all;
  }
  .task-btn:active { transform: scale(.96); }
  .task-btn.done { background: var(--green); }
  .task-btn.unset {
    background: var(--unset-bg);
    color: var(--unset-text);
    border: 1.5px dashed var(--unset-border);
  }
  .task-btn .t-name {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.25;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .task-btn .t-sub { font-size: 10px; opacity: .85; font-weight: 400; }
  /* 提醒铃铛（左上）与次数角标（右上）分别跨出按钮上边缘，不占按钮内部空间、互不遮挡 */
  .task-btn .badge {
    position: absolute;
    top: -8px;
    right: -5px;
    min-width: 16px;
    height: 15px;
    border-radius: 999px;
    background: var(--danger);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    line-height: 1;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    pointer-events: none;
    z-index: 2;
  }
  .task-btn .t-bell {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bell-bg);
    border-radius: 999px;
    color: var(--bell-text);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
    pointer-events: none;
    z-index: 2;
  }
  .task-btn .t-bell svg { width: 11px; height: 11px; display: block; }
  /* 铃铛在按钮内左上角，名称/副文案左侧留白避让 */
  .task-btn.has-bell .t-name,
  .task-btn.has-bell .t-sub { padding-left: 13px; }
  /* ---------- 应用内提醒弹窗 ---------- */
  .remind-bell {
    width: 76px;
    height: 76px;
    margin: 4px auto 10px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffb020, #ff8a00);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: #fff;
    box-shadow: 0 6px 18px rgba(255, 138, 0, .35);
    animation: remindPulse 1.2s ease-in-out infinite;
  }
  @keyframes remindPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 6px 18px rgba(255, 138, 0, .35); }
    50% { transform: scale(1.08); box-shadow: 0 10px 26px rgba(255, 138, 0, .5); }
  }
  .remind-pop-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .remind-pop-task {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    margin: 6px 0 2px;
    word-break: break-all;
  }
  .remind-pop-meta { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
  .remind-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 12px 0 4px;
  }
  .remind-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    height: 26px;
    padding: 0 4px 0 8px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 11.5px;
  }
  .remind-item .r-label {
    flex: 1;
    line-height: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .remind-item .r-del {
    border: none;
    background: rgba(255, 255, 255, .28);
    color: #fff;
    border-radius: 6px;
    width: 18px;
    height: 18px;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .seg {
    display: flex;
    gap: 6px;
    margin: 4px 0 10px;
  }
  .seg button {
    flex: 1;
    padding: 8px 2px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 12.5px;
    cursor: pointer;
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .week-row { display: flex; gap: 5px; margin: 2px 0 10px; }
  .week-row button {
    flex: 1;
    padding: 8px 0;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .week-row button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .add-task-btn {
    background: var(--card) !important;
    color: var(--dashed-text) !important;
    border: 1.5px dashed var(--dashed-border);
    font-size: 12px;
    font-weight: 400 !important;
    white-space: nowrap;
  }
  .add-cat-btn {
    width: 100%;
    border: 1.5px dashed var(--dashed-border);
    background: transparent;
    color: var(--dashed-text);
    border-radius: var(--radius);
    padding: 13px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .add-cat-btn:active { background: var(--dashed-hover); }

  /* ---------- 弹窗 ---------- */
  .mask {
    position: fixed;
    inset: 0;
    background: var(--mask-bg);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    animation: fadeIn .15s ease;
  }
  @media (min-width: 480px) { .mask { align-items: center; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--card);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
    animation: slideUp .2s ease;
  }
  @media (min-width: 480px) { .sheet { border-radius: 18px; margin: 0 16px; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
  .sheet h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--field-bg);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 15px;
    color: var(--text);
    outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); background: var(--card); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn:active { opacity: .85; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--chip-bg); color: var(--text); }
  .btn-danger { background: var(--danger-bg); color: var(--danger); }
  .menu-list { display: flex; flex-direction: column; }
  .menu-item {
    border: none;
    background: var(--card);
    text-align: left;
    padding: 14px 6px;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    border-radius: 8px;
    color: var(--text);
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--press-bg); }
  .menu-item.danger { color: var(--danger); }
  .counter-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 10px 0 4px;
  }
  .counter-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--chip-bg);
    font-size: 22px;
    cursor: pointer;
    color: var(--text);
    flex: 0 0 auto;
  }
  .counter-btn:active { background: var(--chip-press); }
  input.counter-val {
    border: 1px solid var(--border);
    background: var(--field-bg);
    border-radius: 12px;
    padding: 10px;
    font-size: 24px;
    font-weight: 700;
    width: 92px;
    text-align: center;
    color: var(--text);
    outline: none;
    -moz-appearance: textfield;
  }
  input.counter-val::-webkit-outer-spin-button,
  input.counter-val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.7; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    z-index: 200;
    animation: fadeIn .15s ease;
    pointer-events: none;
    white-space: nowrap;
    max-width: 86vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* ---------- 深浅色过渡 ---------- */
  body, header, .category, .sheet, .tab, .clip-item, .menu-item, .subcat-row,
  .field input, .field select, .seg button, .week-row button, .counter-btn,
  .icon-btn, .clip-del, .btn, .head-pill, .add-task-btn, .add-cat-btn, .subcat-add,
  input.counter-val, .clip-empty, .subcat-empty, #themeToggle {
    transition: background-color .25s ease, color .25s ease, border-color .25s ease;
  }

  /* ---------- 主题切换悬浮按钮（右侧边缘中上方） ---------- */
  #themeToggle {
    position: fixed;
    right: 0;
    top: 36%;
    z-index: 60;
    width: 38px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 12px 0 0 12px;
    background: var(--card);
    color: var(--text);
    box-shadow: -2px 2px 10px rgba(16, 24, 40, .14);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #themeToggle:active { transform: scale(.92); }
  #themeToggle svg { width: 20px; height: 20px; display: block; }
  /* 浅色模式显示月亮（点击进深色），深色模式显示太阳（点击回浅色） */
  #themeToggle .icon-sun { display: none; }
  :root[data-theme="dark"] #themeToggle .icon-sun { display: block; }
  :root[data-theme="dark"] #themeToggle .icon-moon { display: none; }
</style>
</head>
<body>
<button id="themeToggle" type="button" title="切换深色 / 浅色模式" aria-label="切换深色 / 浅色模式">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</button>

<header>
  <div class="head-row">
    <button type="button" id="installBtn" class="head-pill" title="添加到桌面">
      <span class="pill-full">+ 添加到桌面</span><span class="pill-short">+ 桌面</span>
    </button>
    <h1>任务记录工具</h1>
    <button type="button" id="authBtn" class="head-pill" title="登录 / 注册">登录</button>
  </div>
  <nav class="tab-bar" id="tabBar"></nav>
</header>

<main id="main"></main>
<div id="modalRoot"></div>

<script>
(function () {
  'use strict';

  /* ================= 常量与状态 ================= */
  var STORAGE_KEY = 'taskRecordTool.v1';
  var AUTH_KEY = 'taskRecordTool.auth.v1';
  var THEME_KEY = 'taskRecordTool.theme';  /* 深浅色偏好：light / dark，缺省跟随系统 */
  /* 云同步服务地址（部署 Cloudflare Worker 后填入，为空时仅本地模式） */
  var API_BASE = 'https://task-record-api.pages.dev';
  /* App（APK）下载链接：安卓 / 鸿蒙设备装上它，提醒由系统闹钟承载，关掉页面也能响 */
  var APK_DOWNLOAD_URL = 'https://doctorstrange1122.github.io/task-record-tool/task-record-tool.apk';
  /* 是否运行在 App 内（APK 的 WebView 会带 app=1 参数或 UA 标记） */
  var IN_APP = /[?&]app=1/.test(location.search) ||
               /TaskReminderApp/.test(navigator.userAgent || '');
  var DAY = 86400000;
  var LONG_PRESS_MS = 500;
  var MAX_COUNT = 9999;

  var data = loadData();
  var auth = loadAuth();
  var suppressSync = false;
  var syncTimer = null;

  /* ================= 数据层 ================= */
  function genId() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  function newTask() {
    /* 默认统计周期为一天，0 点自动清零 */
    return { id: genId(), configured: false, name: '', cycleDays: 1, cycleStart: 0, count: 0, reminders: [], subId: null };
  }

  function defaultData() {
    var acc = { id: genId(), name: '账号1', categories: [] };
    var cat = { id: genId(), name: '默认分类', tasks: [], subcats: [] };
    for (var i = 0; i < 3; i++) cat.tasks.push(newTask());
    acc.categories.push(cat);
    return { activeAccountId: acc.id, accounts: [acc], clipboards: [] };
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.accounts) && d.accounts.length &&
            Array.isArray(d.accounts[0].categories)) {
          migrateReminders(d);
          if (!Array.isArray(d.clipboards)) d.clipboards = [];
          else d.clipboards = d.clipboards.filter(function (c) {
            return !!c && typeof c.text === 'string' && (Date.now() - c.at) < 48 * 3600 * 1000;
          });
          return d;
        }
      }
    } catch (e) { /* 数据损坏时回退默认数据 */ }
    return defaultData();
  }

  /* 旧版单值 remind 字段迁移为 reminders 数组（兼容历史数据） */
  function migrateReminders(d) {
    (d.accounts || []).forEach(function (acc) {
      (acc.categories || []).forEach(function (cat) {
        if (!Array.isArray(cat.subcats)) cat.subcats = [];
        (cat.tasks || []).forEach(function (t) {
          if (t.remind && !t.reminders) {
            t.reminders = [{ id: 'r' + (t.id || '') + '-' + Date.now().toString(36), time: t.remind, repeat: 'daily', enabled: true }];
          }
          if (t.remind) delete t.remind;
          if (!Array.isArray(t.reminders)) t.reminders = [];
          if (t.subId === undefined) t.subId = null;
        });
      });
    });
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    if (!suppressSync) scheduleSync();
  }

  /* ================= 跨设备剪贴板 ================= */
  var CLIP_EXPIRE_MS = 48 * 3600 * 1000; /* 记录保存 48 小时 */
  var CLIP_PAGE_SIZE = 15;               /* 每页最多显示 15 条 */
  var clipboardView = false;             /* 当前是否显示剪贴板面板 */
  var clipDraft = '';                     /* 剪贴板输入框草稿：切走 tab 再回来不丢失 */
  /* 输入框为单行 input，仅显示预览；完整内容（含换行）始终存在 clipDraft */
  function clipSingleLine(t) {
    return String(t || '').replace(/\r\n|\r|\n/g, ' ');
  }
  var TAB_KEY = 'taskRecordTool.tab';     /* 记住上次停留的 tab */

  /* 保存当前激活 tab（剪贴板 / 某个账号）到本地 */
  function saveActiveTab() {
    try {
      localStorage.setItem(TAB_KEY, JSON.stringify({
        clip: clipboardView,
        accId: clipboardView ? null : data.activeAccountId
      }));
    } catch (e) {}
  }

  /* 启动时恢复上次停留的 tab；若记录的账号已不存在则回退到首个账号 */
  function restoreActiveTab() {
    try {
      var raw = localStorage.getItem(TAB_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s.clip) {
        clipboardView = true;
      } else if (s.accId && data.accounts.some(function (a) { return a.id === s.accId; })) {
        data.activeAccountId = s.accId;
      }
    } catch (e) {}
  }

  function clipFresh(c) {
    return !!c && typeof c.text === 'string' && (Date.now() - c.at) < CLIP_EXPIRE_MS;
  }

  /* 清理过期记录，返回是否有删除 */
  function pruneClipboards() {
    if (!Array.isArray(data.clipboards)) { data.clipboards = []; return false; }
    var before = data.clipboards.length;
    data.clipboards = data.clipboards.filter(clipFresh);
    return data.clipboards.length !== before;
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function hhmm(ts) {
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-999px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); toast(okMsg || '已复制'); }
      catch (e) { toast('复制失败，请长按内容手动复制'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast(okMsg || '已复制');
      }, fallback);
    } else {
      fallback();
    }
  }

  function readSystemClipboard() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      return navigator.clipboard.readText();
    }
    return Promise.reject(new Error('clipboard api unavailable'));
  }

  /* 「粘贴」按钮：尝试把系统剪贴板内容读入输入框；
     读不到（浏览器限制 / 权限 / 非文本）时聚焦输入框，提示长按手动粘贴 */
  function onClipPaste() {
    var ta = document.getElementById('clipInput');
    readSystemClipboard().then(function (t) {
      t = (t || '').trim();
      clipDraft = t;
      if (ta) { ta.value = clipSingleLine(t); ta.focus(); }
      if (t) { toast('已粘贴到输入框'); }
      else { toast('未能读取剪贴板，请长按输入框手动粘贴'); }
    }).catch(function () {
      if (ta) ta.focus();
      toast('未能读取剪贴板，请长按输入框手动粘贴');
    });
  }

  /* 「保存」按钮：把输入框内容存入剪贴板记录 */
  function onClipSave() {
    var ta = document.getElementById('clipInput');
    var v = (clipDraft || '').trim();
    if (!v) { toast('请先输入或粘贴内容'); return; }
    clipDraft = '';
    if (ta) { ta.value = ''; ta.blur(); }
    saveClipRecord(v);
  }

  /* 「清空」按钮：清空输入框 */
  function onClipClear() {
    var ta = document.getElementById('clipInput');
    clipDraft = '';
    if (ta) { ta.value = ''; ta.focus(); }
  }

  /* 放大输入框：弹出大编辑弹窗（不在原界面放大），完成后写回小输入框 */
  function openClipExpandSheet() {
    openModal(function (sheet, close) {
      sheet.classList.add('clip-edit');
      var h = document.createElement('h3');
      h.textContent = '编辑内容';
      sheet.appendChild(h);
      var small = document.getElementById('clipInput');
      var ta = document.createElement('textarea');
      ta.className = 'clip-input';
      ta.rows = 8;
      ta.placeholder = '粘贴或输入要保存的内容';
      ta.setAttribute('aria-label', '剪贴板内容');
      ta.value = clipDraft;
      sheet.appendChild(ta);
      var actions = document.createElement('div');
      actions.className = 'sheet-actions';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn btn-ghost';
      cancel.textContent = '取消';
      cancel.addEventListener('click', close);
      var ok = document.createElement('button');
      ok.type = 'button';
      ok.className = 'btn btn-primary';
      ok.textContent = '完成';
      ok.addEventListener('click', function () {
        clipDraft = ta.value;
        if (small) { small.value = clipSingleLine(ta.value); }
        close();
      });
      actions.appendChild(cancel);
      actions.appendChild(ok);
      sheet.appendChild(actions);
      setTimeout(function () { try { ta.focus(); } catch (e) {} }, 120);
    });
  }

  function saveClipRecord(text) {
    pruneClipboards();
    data.clipboards.unshift({ id: genId(), text: text, at: Date.now() });
    save();
    renderClipboardList();
    toast('已保存到剪贴板记录');
  }

  function deleteClipRecord(id) {
    data.clipboards = data.clipboards.filter(function (c) { return c.id !== id; });
    save();
    renderClipboardList();
  }

  function renderClipboardPanel() {
    var main = document.getElementById('main');
    main.innerHTML = '';
    var panel = document.createElement('section');
    panel.className = 'category';

    var head = document.createElement('div');
    head.className = 'clip-head';
    var title = document.createElement('div');
    var t = document.createElement('span');
    t.className = 'clip-title';
    t.textContent = '跨设备剪贴板';
    var sub = document.createElement('span');
    sub.className = 'clip-sub';
    sub.textContent = '保存 48 小时 · 每页最多 15 条';
    title.appendChild(t);
    title.appendChild(sub);
    head.appendChild(title);
    panel.appendChild(head);

    /* 输入框（单行高）+ 右侧放大按钮 */
    var inputRow = document.createElement('div');
    inputRow.className = 'clip-input-row';
    var input = document.createElement('input');
    input.type = 'text';
    input.id = 'clipInput';
    input.className = 'clip-input';
    input.placeholder = '粘贴或输入要保存的内容';
    input.value = clipSingleLine(clipDraft);
    input.addEventListener('input', function () { clipDraft = input.value; });
    inputRow.appendChild(input);
    var expandBtn = document.createElement('button');
    expandBtn.type = 'button';
    expandBtn.className = 'clip-expand';
    expandBtn.title = '放大输入框';
    expandBtn.setAttribute('aria-label', '放大输入框');
    expandBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/>' +
      '<polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/>' +
      '<line x1="3" y1="21" x2="10" y2="14"/></svg>';
    expandBtn.addEventListener('click', openClipExpandSheet);
    inputRow.appendChild(expandBtn);
    panel.appendChild(inputRow);

    /* 三个按钮：同一容器，中间分隔线 */
    var actions = document.createElement('div');
    actions.className = 'clip-actions';
    var pasteBtn = document.createElement('button');
    pasteBtn.type = 'button';
    pasteBtn.className = 'clip-paste';
    pasteBtn.textContent = '粘贴';
    pasteBtn.addEventListener('click', onClipPaste);
    actions.appendChild(pasteBtn);
    var saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'clip-save';
    saveBtn.textContent = '保存';
    saveBtn.addEventListener('click', onClipSave);
    actions.appendChild(saveBtn);
    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'clip-clear';
    clearBtn.textContent = '清空';
    clearBtn.addEventListener('click', onClipClear);
    actions.appendChild(clearBtn);
    panel.appendChild(actions);

    main.appendChild(panel);

    /* 容器二：保存的记录（独立卡片） */
    var listPanel = document.createElement('section');
    listPanel.className = 'category';
    var copyHint = document.createElement('div');
    copyHint.className = 'clip-copy-hint';
    copyHint.textContent = '👇点击记录即可复制';
    listPanel.appendChild(copyHint);
    var list = document.createElement('div');
    list.className = 'clip-list';
    list.id = 'clipList';
    listPanel.appendChild(list);
    main.appendChild(listPanel);

    renderClipboardList();
  }

  function renderClipboardList() {
    var list = document.getElementById('clipList');
    if (!list) return;
    list.innerHTML = '';
    pruneClipboards();
    var items = data.clipboards.slice().sort(function (a, b) { return b.at - a.at; })
      .slice(0, CLIP_PAGE_SIZE);
    if (!items.length) {
      var empty = document.createElement('div');
      empty.className = 'clip-empty';
      empty.textContent = '暂无剪贴板记录';
      list.appendChild(empty);
      return;
    }
    items.forEach(function (c, i) {
      var row = document.createElement('div');
      row.className = 'clip-item';
      var idx = document.createElement('span');
      idx.className = 'clip-idx';
      idx.textContent = (i + 1) + '.';
      var txt = document.createElement('span');
      txt.className = 'clip-text';
      txt.textContent = c.text;
      var time = document.createElement('span');
      time.className = 'clip-time';
      time.textContent = hhmm(c.at);
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'clip-del';
      del.textContent = '✕';
      del.title = '删除该条记录';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteClipRecord(c.id);
      });
      row.appendChild(idx);
      row.appendChild(txt);
      row.appendChild(time);
      row.appendChild(del);
      row.addEventListener('click', function () {
        copyText(c.text, '已复制该条记录');
      });
      list.appendChild(row);
    });
  }

  function activeAccount() {
    var acc = null;
    data.accounts.forEach(function (a) { if (a.id === data.activeAccountId) acc = a; });
    if (!acc) { acc = data.accounts[0]; data.activeAccountId = acc.id; }
    return acc;
  }

  function findTask(taskId) {
    var res = null;
    data.accounts.some(function (acc) {
      return acc.categories.some(function (cat) {
        return cat.tasks.some(function (t) {
          if (t.id === taskId) { res = { task: t, cat: cat, account: acc }; return true; }
          return false;
        });
      });
    });
    return res;
  }

  function removeTask(task) {
    data.accounts.forEach(function (acc) {
      acc.categories.forEach(function (cat) {
        var i = cat.tasks.indexOf(task);
        if (i > -1) cat.tasks.splice(i, 1);
      });
    });
    save();
    render();
  }

  /* ================= 周期统计逻辑（0 点清零） ================= */
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

  /* 清零时刻：周期开始那天的 0 点 + N 天（1 天周期即每天 0 点清零，与点击时间无关） */
  function resetAt(task) { return startOfDay(task.cycleStart) + Math.max(1, task.cycleDays || 1) * DAY; }

  function isCycleExpired(task) {
    return task.configured && task.cycleStart > 0 && Date.now() >= resetAt(task);
  }

  function remainLabel(task) {
    if (!task.configured) return '';
    var n = Math.max(1, task.cycleDays || 1);
    return n === 1 ? '每日刷新' : '每 ' + n + ' 日刷新';
  }

  function isDone(task) { return task.configured && task.count > 0; }
  /* 「未分组」保留条目 id：作为真实条目存于 cat.subcats，可改名/排序，其任务 subId 为 null */
  var UNG_ID = '__ungrouped__';

  /* 周期到期自动清零：次数归零、按钮恢复未完成状态 */
  function checkCycles() {
    var changed = false;
    data.accounts.forEach(function (acc) {
      acc.categories.forEach(function (cat) {
        cat.tasks.forEach(function (t) {
          if (isCycleExpired(t)) {
            t.cycleStart = 0;
            t.count = 0;
            changed = true;
          }
        });
      });
    });
    if (changed) { save(); render(); }
  }

  /* ================= 云同步（Cloudflare Worker） ================= */
  function apiConfigured() { return /^https?:\/\//.test(API_BASE); }

  function apiFetch(path, opts, token) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var t = token || (auth && auth.token);
    if (t) headers['Authorization'] = 'Bearer ' + t;
    return fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
  }

  function loadAuth() {
    try {
      var a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      if (a && a.token && a.username) {
        if (!a.nickname) a.nickname = a.username; /* 兼容早期无昵称的登录态 */
        return a;
      }
    } catch (e) {}
    return null;
  }

  function saveAuth() {
    try {
      if (auth) localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
      else localStorage.removeItem(AUTH_KEY);
    } catch (e) {}
  }

  function updateAuthUI() {
    var btn = document.getElementById('authBtn');
    if (!btn) return;
    if (auth) {
      btn.textContent = auth.nickname || auth.username;
      btn.classList.add('logged');
      btn.title = '已登录：' + (auth.nickname || auth.username) + '（账号 ' + auth.username + '，点击管理）';
    } else {
      btn.textContent = '登录';
      btn.classList.remove('logged');
      btn.title = '登录 / 注册以云同步任务数据';
    }
  }

  function clearAuth(msg) {
    auth = null;
    saveAuth();
    updateAuthUI();
    render();
    if (msg) toast(msg);
  }

  /* 本地有变更时防抖上传 */
  function scheduleSync(delay) {
    if (!auth || !apiConfigured()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () {
      syncTimer = null;
      pushData(false);
    }, delay || 800);
  }

  function pushData(quiet) {
    if (!auth || !apiConfigured()) return Promise.resolve();
    return apiFetch('/api/data', {
      method: 'PUT',
      body: JSON.stringify({ data: data, base: auth.lastSync || null })
    }).then(function (res) {
      if (res.status === 401) { clearAuth('登录已失效，请重新登录'); return; }
      return res.json().then(function (result) {
        if (res.ok) {
          auth.lastSync = result.updated_at;
          saveAuth();
        } else if (res.status === 409) {
          /* 其他设备有新写入：拉取最新数据 */
          return pullData(true).then(function () {
            if (!quiet) toast('检测到其他设备的更新，已加载最新数据');
          });
        }
      });
    }).catch(function () { /* 离线时静默失败，下次变更重试 */ });
  }

  function pullData(quiet) {
    if (!auth || !apiConfigured()) return Promise.resolve();
    return apiFetch('/api/data').then(function (res) {
      if (res.status === 401) { clearAuth('登录已失效，请重新登录'); return; }
      return res.json().then(function (result) {
        if (res.ok && result.data) {
          var serverAt = result.updated_at || 0;
          if (!auth.lastSync || serverAt > auth.lastSync) {
            suppressSync = true;
            data = result.data;
            pruneClipboards();
            auth.lastSync = serverAt;
            saveAuth();
            save();
            render();
            suppressSync = false;
            if (!quiet) toast('已同步云端最新数据');
          }
        }
      });
    }).catch(function () { /* 离线时静默失败 */ });
  }

  function doAuth(mode, username, password, nickname) {
    return apiFetch(mode === 'login' ? '/api/login' : '/api/register', {
      method: 'POST',
      body: JSON.stringify({ username: username, password: password, nickname: nickname || '' })
    }).then(function (res) {
      return res.json().then(function (result) {
        if (!res.ok) throw new Error(result.error || '操作失败，请重试');
        auth = { token: result.token, username: result.username, nickname: result.nickname || result.username, lastSync: null };
        saveAuth();
        updateAuthUI();
        render();
        if (mode === 'register') {
          /* 新注册用户：把本机已设置的内容同步至账号 */
          return pushData(true).then(function () {
            return '注册成功，本机数据已同步到账号';
          });
        }
        if (result.data) {
          /* 已有数据：采用云端版本 */
          suppressSync = true;
          data = result.data;
          auth.lastSync = result.updated_at || null;
          saveAuth();
          save();
          render();
          suppressSync = false;
          return '登录成功，已从云端恢复数据';
        }
        return pushData(true).then(function () {
          return '登录成功，云端为空，已上传本机数据';
        });
      });
    }).catch(function (e) {
      if (e instanceof TypeError) throw new Error('网络异常，无法连接云同步服务');
      throw e;
    });
  }

  function logout() {
    var token = auth && auth.token;
    auth = null;
    saveAuth();
    updateAuthUI();
    render();
    toast('已退出登录（本机数据仍保留）');
    if (token && apiConfigured()) {
      apiFetch('/api/logout', { method: 'POST', body: '{}' }, token).catch(function () {});
    }
  }

  /* ================= 渲染 ================= */
  function render() {
    renderTabs();
    renderMain();
  }

  function renderTabs() {
    var bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    var activeTab = null;
    /* 固定的「跨设备剪贴板」tab，位于账号 tab 左侧 */
    var clipTab = document.createElement('button');
    clipTab.type = 'button';
    clipTab.className = 'tab clip-tab' + (clipboardView ? ' active' : '');
    clipTab.textContent = '剪贴板';
    clipTab.title = '剪贴板：自动保存最近一条剪贴板内容，保存 48 小时，每页最多 15 条';
    clipTab.addEventListener('click', function () {
      if (suppressClick) { suppressClick = false; return; }
      clipboardView = true;
      saveActiveTab();
      render();
    });
    bar.appendChild(clipTab);
    data.accounts.forEach(function (acc) {
      var tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'tab' + (!clipboardView && acc.id === data.activeAccountId ? ' active' : '');
      tab.textContent = acc.name;
      tab.title = acc.name + '（长按可重命名/删除）';
      tab.addEventListener('click', function () {
      if (suppressClick) { suppressClick = false; return; }
      clipboardView = false;
      data.activeAccountId = acc.id;
      saveActiveTab();
      save();
      render();
      });
      attachLongPress(tab, function () { openAccountMenu(acc); });
      if (!clipboardView && acc.id === data.activeAccountId) activeTab = tab;
      bar.appendChild(tab);
    });
    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'tab add-tab';
    add.textContent = '+';
    add.title = '添加账号';
    add.addEventListener('click', function () {
      if (suppressClick) { suppressClick = false; return; }
      openAddAccountDialog();
    });
    bar.appendChild(add);
    if (activeTab && activeTab.scrollIntoView) {
      activeTab.scrollIntoView({ inline: 'center', block: 'nearest' });
    }
  }

  function renderMain() {
    if (clipboardView) { renderClipboardPanel(); return; }
    var acc = activeAccount();
    /* 清理空名称子分类，并把指向已删除子分类的任务回退到未分组；
       始终保留「未分组」条目（可改名/排序），即使还没有真实子分类也在管理界面可见 */
    acc.categories.forEach(function (cat) {
      if (!Array.isArray(cat.subcats)) cat.subcats = [];
      var ids = {};
      cat.subcats = cat.subcats.filter(function (s) {
        s.name = (s.name || '').trim();
        if (!s.name && s.id !== UNG_ID) return false;
        ids[s.id] = true;
        return true;
      });
      (cat.tasks || []).forEach(function (t) {
        if (t.subId === UNG_ID) t.subId = null;
        if (t.subId && !ids[t.subId]) t.subId = null;
      });
      var hasUng = cat.subcats.some(function (s) { return s.id === UNG_ID; });
      if (!hasUng) {
        cat.subcats.push({ id: UNG_ID, name: '未分组' });
      } else {
        var ungEntry = cat.subcats.filter(function (s) { return s.id === UNG_ID; })[0];
        if (!ungEntry.name) ungEntry.name = '未分组';
      }
    });
    var main = document.getElementById('main');
    main.innerHTML = '';
    acc.categories.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'category';

      var header = document.createElement('div');
      header.className = 'cat-header';
      var nameWrap = document.createElement('div');
      var name = document.createElement('span');
      name.className = 'cat-name';
      name.textContent = cat.name;
      var sub = document.createElement('span');
      sub.className = 'cat-sub';
      var doneCount = cat.tasks.filter(isDone).length;
      sub.textContent = cat.tasks.length + ' 个任务 · ' + doneCount + ' 个已完成';
      nameWrap.appendChild(name);
      nameWrap.appendChild(sub);
      var more = document.createElement('button');
      more.type = 'button';
      more.className = 'icon-btn';
      more.textContent = '⋯';
      more.title = '分类管理';
      more.addEventListener('click', function () { openCategoryMenu(cat); });
      header.appendChild(nameWrap);
      header.appendChild(more);
      section.appendChild(header);

      /* 按子分类分组渲染（含「未分组」保留条目，按管理界面排序）；无子分类时直接平铺 */
      if (cat.subcats.length === 0) {
        section.appendChild(buildTaskGrid(cat, cat.tasks, true, ''));
      } else {
        /* 只有一个「未分组」且未改名时，主界面隐藏该分组名（管理界面仍可看到并改名） */
        var onlyDefaultUng = cat.subcats.length === 1 &&
          cat.subcats[0].id === UNG_ID && (cat.subcats[0].name || '未分组') === '未分组';
        cat.subcats.forEach(function (sc) {
          var isUng = sc.id === UNG_ID;
          var scTasks = isUng
            ? cat.tasks.filter(function (t) { return !t.subId; })
            : cat.tasks.filter(function (t) { return t.subId === sc.id; });
          if (!(isUng && onlyDefaultUng)) {
            var sh = document.createElement('div');
            sh.className = 'subcat-header';
            sh.textContent = sc.name;
            section.appendChild(sh);
          }
          section.appendChild(buildTaskGrid(cat, scTasks, isUng, sc.id));
        });
      }

      main.appendChild(section);
    });

    var addCat = document.createElement('button');
    addCat.type = 'button';
    addCat.className = 'add-cat-btn';
    addCat.textContent = '+ 添加分类';
    addCat.addEventListener('click', openAddCategoryDialog);
    main.appendChild(addCat);

    var hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = auth
      ? '点击按钮记录一次完成；长按按钮可管理。数据已开启云同步（' + (auth.nickname || auth.username) + '）。'
      : '点击按钮记录一次完成；长按按钮可管理。数据仅保存在本机，登录后可多设备云同步。';
    main.appendChild(hint);
  }

  function buildTaskButton(task, cat) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'task-btn';
    btn.dataset.taskId = task.id;

    if (!task.configured) {
      btn.classList.add('unset');
      var plus = document.createElement('span');
      plus.className = 't-name';
      plus.textContent = '+';
      var tip = document.createElement('span');
      tip.className = 't-sub';
      tip.textContent = '设置任务';
      btn.appendChild(plus);
      btn.appendChild(tip);
    } else {
      if (isDone(task)) btn.classList.add('done');
      var name = document.createElement('span');
      name.className = 't-name';
      name.textContent = task.name;
      var sub = document.createElement('span');
      sub.className = 't-sub';
      sub.textContent = remainLabel(task);
      btn.appendChild(name);
      btn.appendChild(sub);
      if (task.count > 0) {
        /* 次数角标：跨出按钮右上边缘 */
        var badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = String(task.count);
        btn.appendChild(badge);
      }
      var activeReminders = (task.reminders || []).filter(function (r) { return r.enabled !== false; });
      if (activeReminders.length) {
        /* 提醒铃铛：跨出按钮左上边缘 */
        var bell = document.createElement('span');
        bell.className = 't-bell';
        bell.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';
        bell.title = taskRemindSummary(task);
        btn.classList.add('has-bell');
        btn.appendChild(bell);
      }
    }

    btn.addEventListener('click', function () { onTaskClick(task); });
    attachTaskDrag(btn, task, cat);
    return btn;
  }

  /* 生成一组任务按钮的 3 列网格；withAdd 时在末尾追加「添加任务」入口 */
  function buildTaskGrid(cat, tasks, withAdd, subId) {
    var grid = document.createElement('div');
    grid.className = 'task-grid';
    grid.dataset.subId = subId == null ? '' : subId;
    (tasks || []).forEach(function (task) {
      grid.appendChild(buildTaskButton(task, cat));
    });
    if (!(tasks || []).length && !withAdd) grid.classList.add('empty');
    if (withAdd) {
      var addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'task-btn add-task-btn';
      var addLabel = document.createElement('span');
      addLabel.className = 't-name';
      addLabel.textContent = '+ 添加任务';
      addBtn.appendChild(addLabel);
      addBtn.addEventListener('click', function () { openTaskSetup(null, cat); });
      grid.appendChild(addBtn);
    }
    return grid;
  }

  /* ================= 交互：点击与长按 ================= */
  function onTaskClick(task) {
    if (suppressClick) { suppressClick = false; return; }
    if (!task.configured) {
      openTaskSetup(task, null, false);
      return;
    }
    var now = Date.now();
    if (task.cycleStart === 0 || now >= resetAt(task)) {
      /* 新周期首次完成 */
      task.cycleStart = now;
      task.count = 1;
    } else {
      /* 同一周期内可多次完成 */
      task.count += 1;
    }
    save();
    render();
  }

  var suppressClick = false;

  /* 吞掉长按触发后浏览器补发的那一次 click，避免误触 */
  function swallowNextClick(el) {
    var handler = function (ev) {
      ev.stopPropagation();
      ev.preventDefault();
      el.removeEventListener('click', handler, true);
    };
    el.addEventListener('click', handler, true);
  }

  function attachLongPress(el, callback) {
    var timer = null;
    var sx = 0, sy = 0;

    function start(x, y) {
      sx = x; sy = y;
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () {
        timer = null;
        swallowNextClick(el);
        /* 清除长按过程中浏览器可能拉起的文本选区，避免弹出复制菜单 */
        try {
          var sel = window.getSelection && window.getSelection();
          if (sel && sel.removeAllRanges) sel.removeAllRanges();
          else if (sel && sel.empty) sel.empty();
        } catch (e) {}
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
        callback();
      }, LONG_PRESS_MS);
    }
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
    }

    el.addEventListener('touchstart', function (e) {
      var t = e.touches[0];
      start(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) cancel();
    }, { passive: true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', function (e) { start(e.clientX, e.clientY); });
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    /* 抑制系统长按菜单（移动端） */
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  /* ================= 任务按钮拖动（手机桌面风格） =================
     长按按钮进入「可拖动」状态：
       · 进入后不动 → 松手即弹出任务管理菜单（沿用原长按菜单）。
       · 进入后移动手指 → 跟随手指拖动，可跨子分类（同一大分类内）自由摆放，
         松手落位后即时保存；拖出分类范围则回到原位。
     单击按钮仍正常记录完成，互不冲突。 */
  function attachTaskDrag(btn, task, cat) {
    var press = null;

    function startPress(x, y) {
      if (press) return;
      press = { x: x, y: y, ready: false, dragging: false, timer: null, clone: null, offX: 0, offY: 0 };
      press.timer = setTimeout(function () {
        if (!press) return;
        press.timer = null;
        press.ready = true;
        swallowNextClick(btn);
        try {
          var sel = window.getSelection && window.getSelection();
          if (sel && sel.removeAllRanges) sel.removeAllRanges();
          else if (sel && sel.empty) sel.empty();
        } catch (e) {}
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
      }, LONG_PRESS_MS);
    }

    function cancelPress() {
      if (!press) return;
      if (press.timer) clearTimeout(press.timer);
      if (press.clone && press.clone.parentNode) press.clone.parentNode.removeChild(press.clone);
      btn.classList.remove('drag-origin');
      press = null;
    }

    function startDrag(x, y) {
      var r = btn.getBoundingClientRect();
      press.dragging = true;
      press.offX = press.x - r.left;
      press.offY = press.y - r.top;
      var clone = btn.cloneNode(true);
      clone.className = btn.className;
      clone.classList.add('drag-clone');
      clone.style.position = 'fixed';
      clone.style.margin = '0';
      clone.style.width = r.width + 'px';
      clone.style.height = r.height + 'px';
      clone.style.left = r.left + 'px';
      clone.style.top = r.top + 'px';
      document.body.appendChild(clone);
      press.clone = clone;
      btn.classList.add('drag-origin');
      moveDrag(x, y);
    }

    function moveDrag(x, y) {
      if (!press || !press.dragging) return;
      press.clone.style.left = (x - press.offX) + 'px';
      press.clone.style.top = (y - press.offY) + 'px';
      reposition(x, y);
      autoScroll(y);
    }

    function autoScroll(y) {
      var m = 56;
      if (y < m) window.scrollBy(0, -(m - y) * 0.4);
      else if (y > window.innerHeight - m) window.scrollBy(0, (y - (window.innerHeight - m)) * 0.4);
    }

    function reposition(x, y) {
      var section = btn.closest('section.category');
      if (!section) return;
      var grids = section.querySelectorAll('.task-grid');
      var targetGrid = null;
      for (var i = 0; i < grids.length; i++) {
        var gr = grids[i].getBoundingClientRect();
        if (x >= gr.left && x <= gr.right && y >= gr.top - 10 && y <= gr.bottom + 10) { targetGrid = grids[i]; break; }
      }
      if (!targetGrid) return; /* 拖出该分类范围，保持原位 */

      var buttons = targetGrid.querySelectorAll('.task-btn:not(.add-task-btn):not(.drag-origin)');
      var best = null, bestD = Infinity;
      for (var j = 0; j < buttons.length; j++) {
        var br = buttons[j].getBoundingClientRect();
        var cx = br.left + br.width / 2, cy = br.top + br.height / 2;
        var d = (cx - x) * (cx - x) + (cy - y) * (cy - y);
        if (d < bestD) { bestD = d; best = buttons[j]; }
      }
      var addBtn = targetGrid.querySelector('.add-task-btn');
      if (!best) {
        if (addBtn) targetGrid.insertBefore(btn, addBtn);
        else targetGrid.appendChild(btn);
        return;
      }
      var be = best.getBoundingClientRect();
      if (x < be.left + be.width / 2) {
        targetGrid.insertBefore(btn, best);
      } else {
        var next = best.nextSibling;
        if (next && next.classList && next.classList.contains('add-task-btn')) targetGrid.insertBefore(btn, next);
        else if (next && next !== btn) targetGrid.insertBefore(btn, next);
        else if (addBtn) targetGrid.insertBefore(btn, addBtn);
        else targetGrid.appendChild(btn);
      }
    }

    function commitGridOrder() {
      var section = btn.closest('section.category');
      if (!section) return;
      var grids = section.querySelectorAll('.task-grid');
      var newTasks = [];
      grids.forEach(function (g) {
        var subId = g.dataset.subId || null;
        if (subId === UNG_ID) subId = null;
        g.querySelectorAll('.task-btn:not(.add-task-btn)').forEach(function (b) {
          var t = null;
          for (var k = 0; k < cat.tasks.length; k++) {
            if (cat.tasks[k].id === b.dataset.taskId) { t = cat.tasks[k]; break; }
          }
          if (!t) return;
          t.subId = subId;
          newTasks.push(t);
        });
      });
      if (newTasks.length) cat.tasks = newTasks;
    }

    function endPress() {
      if (!press) return;
      var p = press;
      if (p.timer) clearTimeout(p.timer);
      if (p.dragging) {
        if (p.clone && p.clone.parentNode) p.clone.parentNode.removeChild(p.clone);
        btn.classList.remove('drag-origin');
        press = null;
        commitGridOrder();
        save();
        render();
        toast('位置已保存');
        return;
      }
      if (p.ready) {
        press = null;
        openTaskMenu(task, cat);
        return;
      }
      press = null;
    }

    /* ---- 触摸（移动端） ---- */
    btn.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { cancelPress(); return; }
      var t = e.touches[0];
      startPress(t.clientX, t.clientY);
    }, { passive: true });
    btn.addEventListener('touchmove', function (e) {
      if (!press) return;
      var t = e.touches[0];
      if (!press.ready) {
        if (Math.abs(t.clientX - press.x) > 10 || Math.abs(t.clientY - press.y) > 10) cancelPress();
        return;
      }
      e.preventDefault(); /* 阻止页面滚动，进入拖动 */
      if (!press.dragging) startDrag(t.clientX, t.clientY);
      else moveDrag(t.clientX, t.clientY);
    }, { passive: false });
    btn.addEventListener('touchend', function () { endPress(); });
    btn.addEventListener('touchcancel', function () { cancelPress(); });

    /* ---- 鼠标（桌面端） ---- */
    btn.addEventListener('mousedown', function (e) {
      if (e.button !== 0) return;
      startPress(e.clientX, e.clientY);
      function mm(ev) {
        if (!press) { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); return; }
        if (!press.ready) {
          if (Math.abs(ev.clientX - press.x) > 10 || Math.abs(ev.clientY - press.y) > 10) { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); cancelPress(); }
          return;
        }
        if (!press.dragging) startDrag(ev.clientX, ev.clientY);
        else moveDrag(ev.clientX, ev.clientY);
      }
      function mu() {
        document.removeEventListener('mousemove', mm);
        document.removeEventListener('mouseup', mu);
        endPress();
      }
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup', mu);
    });
    btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  /* ================= 弹窗基础 ================= */
  var modalOpenAt = 0;

  function openModal(build, opts) {
    closeModal();
    opts = opts || {};
    modalOpenAt = Date.now();
    var root = document.getElementById('modalRoot');
    var mask = document.createElement('div');
    mask.className = 'mask';
    var sheet = document.createElement('div');
    sheet.className = 'sheet';
    build(sheet, function () {
      if (mask.parentNode) mask.parentNode.removeChild(mask);
    });
    mask.appendChild(sheet);
    if (opts.dismissOnMask !== false) {
      mask.addEventListener('click', function (e) {
        if (e.target !== mask) return;
        /* 刚弹出的 350ms 内忽略误触 */
        if (Date.now() - modalOpenAt < 350) return;
        if (mask.parentNode) mask.parentNode.removeChild(mask);
      });
    }
    root.appendChild(mask);
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
  }

  /* 表单弹窗 */
  function openFormDialog(o) {
    var confirmed = false;
    openModal(function (sheet, rawClose) {
      function close() {
        if (!confirmed && typeof o.onCancel === 'function') o.onCancel();
        rawClose();
      }
      var h = document.createElement('h3');
      h.textContent = o.title;
      sheet.appendChild(h);

      var inputs = {};
      (o.fields || []).forEach(function (f) {
        var wrap = document.createElement('div');
        wrap.className = 'field';
        var label = document.createElement('label');
        label.textContent = f.label;
        wrap.appendChild(label);
        var input;
        if (f.type === 'select') {
          input = document.createElement('select');
          (f.options || []).forEach(function (opt) {
            var el = document.createElement('option');
            el.value = opt.value;
            el.textContent = opt.label;
            if (String(opt.value) === String(f.value)) el.selected = true;
            input.appendChild(el);
          });
        } else {
          input = document.createElement('input');
          input.type = f.type || 'text';
          input.value = f.value == null ? '' : f.value;
          if (f.placeholder) input.placeholder = f.placeholder;
          if (f.min != null) input.min = f.min;
          if (f.max != null) input.max = f.max;
          if (f.type === 'number') input.inputMode = 'numeric';
        }
        inputs[f.key] = input;
        wrap.appendChild(input);
        sheet.appendChild(wrap);
      });

      var actions = document.createElement('div');
      actions.className = 'sheet-actions';
      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'btn btn-ghost';
      cancelBtn.textContent = '取消';
      cancelBtn.addEventListener('click', close);
      var okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'btn ' + (o.danger ? 'btn-danger' : 'btn-primary');
      okBtn.textContent = o.confirmText || '确定';
      okBtn.addEventListener('click', function () {
        var values = {};
        for (var k in inputs) values[k] = inputs[k].value;
        if (o.onConfirm(values, close) === false) return;
        confirmed = true;
        close();
      });
      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);
      sheet.appendChild(actions);

      var first = sheet.querySelector('input, select');
      if (first) setTimeout(function () { try { first.focus(); } catch (e) {} }, 60);
    }, { dismissOnMask: o.dismissOnMask });
  }

  /* 菜单弹窗 */
  function openMenuDialog(title, items) {
    openModal(function (sheet, close) {
      var h = document.createElement('h3');
      h.textContent = title;
      sheet.appendChild(h);
      var list = document.createElement('div');

        list.appendChild(b);
      });
      sheet.appendChild(list);
      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'btn btn-ghost';
      cancelBtn.textContent = '取消';

  /* 确认弹窗 */
  function openConfirmDialog(title, message, onOk) {

      h.textContent = title;

      sheet.appendChild(p);

      cancelBtn.className = 'btn btn-ghost';

      cancelBtn.addEventListener('click', close);
      var okBtn = document.createElement('button');
      okBtn.type = 'button';
      okBtn.className = 'btn btn-danger';
      okBtn.textContent = '删除';

      actions.appendChild(cancelBtn);
      actions.appendChild(okBtn);

  /* ================= 任务：设置 / 编辑 / 管理 ================= */
  function openTaskSetup(task, cat, isNewAddition) {
    var isEdit = !!task && task.configured;
    var targetCat = cat;
    if (!targetCat && task) {
      var found = findTask(task.id);
      targetCat = found && found.cat;
    }
    if (!isEdit && !task) {
      /* 由「添加任务」入口创建的新按钮，先放入分类，取消时移除 */
      targetCat = cat;
      task = newTask();
      targetCat.tasks.push(task);
      isNewAddition = true;
    }

    var fields = [
      { key: 'name', label: '任务名称', type: 'text', value: isEdit ? task.name : '', placeholder: '请输入任务名称' },
      { key: 'cycle', label: '次数统计清零周期（天）', type: 'number', value: isEdit ? task.cycleDays : 1, min: 1, max: 3650, placeholder: '1' }
    ];
    if (targetCat.subcats && targetCat.subcats.length) {
      var ungEntry = targetCat.subcats.filter(function (s) { return s.id === UNG_ID; })[0];
      var subOptions = [{ value: '', label: (ungEntry && ungEntry.name) || '不分组' }].concat(
        targetCat.subcats.filter(function (s) { return s.id !== UNG_ID; }).map(function (s) {
          return { value: s.id, label: s.name };
        })
      );
      fields.push({ key: 'subId', label: '子分类', type: 'select', value: isEdit ? (task.subId || '') : '', options: subOptions });
    }

    openFormDialog({
      title: isEdit ? '编辑任务' : '设置任务',
      dismissOnMask: isNewAddition ? false : true,
      fields: fields,
      confirmText: isEdit ? '保存' : '确定',
      onConfirm: function (v) {
        var name = (v.name || '').trim();
        if (!name) { toast('请输入任务名称'); return false; }
        var cycle = parseInt(v.cycle, 10);
        if (!cycle || cycle < 1) cycle = 1;
        if (cycle > 3650) cycle = 3650;
        task.configured = true;
        task.name = name;
        task.cycleDays = cycle;
        task.subId = (targetCat.subcats && targetCat.subcats.length && v.subId) ? v.subId : null;
        save();
        render();
        toast(isEdit ? '已保存' : '设置完成，点击按钮记录完成');
      },
      onCancel: function () {
        /* 取消「添加任务」时移除刚创建的占位按钮 */
        if (!task.configured && targetCat) {
          var i = targetCat.tasks.indexOf(task);
          if (i > -1) targetCat.tasks.splice(i, 1);
          save();
          render();
        }
      }
    });
  }

  /* 长按管理：编辑 / 调整次数 / 重置统计 / 删除 */
  function openTaskMenu(task, cat) {
    if (!task.configured) {
      openMenuDialog('任务按钮', [
        {
          label: '设置任务',
          onClick: function () { openTaskSetup(task, cat, false); }

        {
          label: '删除任务按钮',
          danger: true,
          onClick: function () {
            openConfirmDialog('删除任务按钮', '确定删除这个尚未设置的任务按钮吗？', function () {
              removeTask(task);

            });
          }
        }
      ]);

    }
    openMenuDialog('管理 · ' + task.name, [
      {
        label: '编辑任务',

        onClick: function () { openCountDialog(task); }
      },
      {
        label: (task.reminders && task.reminders.length)
          ? '设置提醒（已设 ' + task.reminders.filter(function (r) { return r.enabled !== false; }).length + ' 条）'
          : '设置提醒',
        onClick: function () { openRemindDialog(task); }
      },
      {
        label: '重置统计（次数清零）',
        onClick: function () {
          task.count = 0;

        }
      },
      {
        label: '删除任务',
        danger: true,
        onClick: function () {
          openConfirmDialog('删除任务', '确定删除任务「' + task.name + '」吗？', function () {
            removeTask(task);
            toast('已删除');
          });
        }
      }
    ]);
  }

  /* 手动调整次数 */
  /* ================= 提醒功能（应用内弹窗 + 系统日历导出） ================= */
  var REMIND_PRESETS = [
    { label: '早 9 点', value: '09:00' },
    { label: '中午 12 点', value: '12:00' },
    { label: '晚上 21 点', value: '21:00' }
  ];
  var REPEAT_OPTIONS = [
    { value: 'daily', label: '每天' },
    { value: 'weekly', label: '每周' },
    { value: 'cycle', label: '跟随周期' },
    { value: 'date', label: '指定日期' }
  ];
  var WEEK_LABELS = ['日', '一', '二', '三', '四', '五', '六'];
  var FIRED_KEY = 'taskRecordTool.remindFired.v1';
  var SNOOZE_KEY = 'taskRecordTool.remindSnooze.v1';

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function parseTime(str) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(str || ''));
    if (!m) return null;
    var hh = +m[1], mm = +m[2];
    if (hh > 23 || mm > 59) return null;
    return { hh: hh, mm: mm };
  }

  /* 单条提醒的中文描述，如「每天 09:00」「每周一、三 09:00」「每3日 09:00」「10月20日 09:00」 */
  function reminderLabel(r, task) {
    var base = '';
    if (r.repeat === 'weekly') {
      var ds = (r.days || []).slice().sort();
      if (ds.length === 1) base = '每周' + WEEK_LABELS[ds[0]];
      else if (ds.length > 1) base = '每周' + WEEK_LABELS[ds[0]] + '、' + ds.slice(1).map(function (d) { return WEEK_LABELS[d]; }).join('、');
      else base = '每周';
    } else if (r.repeat === 'cycle') {
      base = '每 ' + Math.max(1, task.cycleDays || 1) + ' 日';
    } else if (r.repeat === 'date') {
      var p = String(r.date || '').split('-');
      base = p.length === 3 ? (+p[1]) + '月' + (+p[2]) + '日' : '指定日期';
    } else {
      base = '每天';
    }
    return base + ' ' + r.time;
  }

  function taskRemindSummary(task) {
    var list = (task.reminders || []).filter(function (r) { return r.enabled !== false; });
    if (!list.length) return '';
    return '已设 ' + list.length + ' 条提醒：' + list.map(function (r) { return reminderLabel(r, task); }).join('；');
  }

  /* 某一天（传入当天 0 点）的触发时刻；weekly 不在选定星期返回 null */
  function occurrenceAt(r, dayStartTs) {
    var p = parseTime(r.time);
    if (!p) return null;
    var d = new Date(dayStartTs);
    d.setHours(p.hh, p.mm, 0, 0);
    if (r.repeat === 'weekly' && (r.days || []).indexOf(d.getDay()) === -1) return null;
    return d.getTime();
  }

  /* fromTs 之后的下一次触发时刻 */
  function nextOccurrence(r, task, fromTs) {
    if (r.repeat === 'date') {
      var parts = String(r.date || '').split('-');
      if (parts.length !== 3) return null;
      var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      var p = parseTime(r.time);
      if (!p) return null;
      d.setHours(p.hh, p.mm, 0, 0);
      return d.getTime() >= fromTs ? d.getTime() : null;
    }
    if (r.repeat === 'cycle') {
      var N = Math.max(1, task.cycleDays || 1);
      var base = startOfDay(task.cycleStart || fromTs);
      var pp = parseTime(r.time);
      if (!pp) return null;
      var k = 0, occ;
      do {
        occ = new Date(base + k * N * DAY);
        occ.setHours(pp.hh, pp.mm, 0, 0);
        k++;
      } while (occ.getTime() < fromTs && k < 4000);
      return occ.getTime() >= fromTs ? occ.getTime() : null;
    }
    var day = startOfDay(fromTs);
    for (var i = 0; i < 400; i++) {
      var o = occurrenceAt(r, day + i * DAY);
      if (o !== null && o >= fromTs) return o;
    }
    return null;
  }

  /* 刚刚过去（120 秒内）的那次触发时刻，用于应用内弹窗判断 */
  function recentOccurrence(r, task, nowTs) {
    var today = occurrenceAt(r, startOfDay(nowTs));
    if (today !== null && today <= nowTs && nowTs - today <= 120000) return today;
    if (r.repeat === 'cycle') {
      var N = Math.max(1, task.cycleDays || 1);
      var base = startOfDay(task.cycleStart || nowTs);
      var p = parseTime(r.time);
      if (!p) return null;
      var k = Math.floor((startOfDay(nowTs) - base) / (N * DAY));
      for (var i = k; i >= 0 && i >= k - 2; i--) {
        var d = new Date(base + i * N * DAY);
        d.setHours(p.hh, p.mm, 0, 0);
        if (d.getTime() <= nowTs && nowTs - d.getTime() <= 120000) return d.getTime();
      }
    }
    return null;
  }

  function icsEsc(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  /* 生成日历日程文件（.ics）：每个提醒一个日程，按重复规则生成 RRULE + 准点闹钟 */
  function buildReminderIcs(task) {
    var list = (task.reminders || []).filter(function (r) { return r.enabled !== false && parseTime(r.time); });
    if (!list.length) return null;
    var now = Date.now();
    var events = [];
    list.forEach(function (r) {
      var start = nextOccurrence(r, task, now);
      if (!start) return;
      var end = start + 15 * 60000;
      function fmt(d) {
        return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
          'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
      }
      var rrule = '';
      if (r.repeat === 'daily') rrule = 'RRULE:FREQ=DAILY';
      else if (r.repeat === 'weekly') {
        var map = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
        var days = (r.days || []).slice().sort().map(function (d) { return map[d]; });
        if (!days.length) return;
        rrule = 'RRULE:FREQ=WEEKLY;BYDAY=' + days.join(',');
      } else if (r.repeat === 'cycle') {
        rrule = 'RRULE:FREQ=DAILY;INTERVAL=' + Math.max(1, task.cycleDays || 1);
      }
      events.push([
        'BEGIN:VEVENT',
        'UID:task-' + task.id + '-' + r.id + '-' + start + '@task-record',
        'DTSTAMP:' + fmt(new Date()),
        'DTSTART:' + fmt(new Date(start)),
        'DTEND:' + fmt(new Date(end)),
        rrule,
        'SUMMARY:' + icsEsc('任务提醒：' + task.name),
        'DESCRIPTION:' + icsEsc('该去完成任务「' + task.name + '」了（' + reminderLabel(r, task) + '，任务记录工具）'),
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:' + icsEsc('任务提醒：' + task.name),
        'END:VALARM',
        'END:VEVENT'
      ].filter(function (l) { return l !== ''; }).join('\r\n'));
    });
    if (!events.length) return null;
    return [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//任务记录工具//任务管理//CN',
      'CALSCALE:GREGORIAN',
      events.join('\r\n'),
      'END:VCALENDAR'
    ].join('\r\n');
  }

  function downloadReminderIcs(task) {
    var ics = buildReminderIcs(task);
    if (!ics) { toast('当前没有可导出的提醒'); return; }
    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '任务提醒-' + task.name + '.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      try { URL.revokeObjectURL(a.href); } catch (e) {}
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 800);
  }

  /* ---------- 应用内提醒：弹窗 + 提示音 + 稍后提醒 ---------- */
  var remindQueue = [];
  var remindPopupOpen = false;

  function playRemindSound() {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      var ctx = playRemindSound._ctx || (playRemindSound._ctx = new Ctx());
      if (ctx.state === 'suspended') ctx.resume();
      [0, 0.22].forEach(function (delay) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = 880;
        var t0 = ctx.currentTime + delay;
        g.gain.setValueAtTime(0.001, t0);
        g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.18);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t0);
        o.stop(t0 + 0.2);
      });
    } catch (e) { /* 不支持音频时静默 */ }
  }

  function loadFiredReminders() {
    try { return JSON.parse(localStorage.getItem(FIRED_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveFiredReminders(o) {
    try {
      /* 只保留最近 2 天的记录，避免无限增长 */
      var cutoff = Date.now() - 2 * 86400000, out = {};
      Object.keys(o).forEach(function (k) { if (o[k] > cutoff) out[k] = o[k]; });
      localStorage.setItem(FIRED_KEY, JSON.stringify(out));
    } catch (e) {}
  }
  function loadSnoozes() {
    try { return JSON.parse(localStorage.getItem(SNOOZE_KEY) || '{}'); } catch (e) { return {}; }
  }
  function saveSnoozes(o) {
    try { localStorage.setItem(SNOOZE_KEY, JSON.stringify(o)); } catch (e) {}
  }

  function fireReminder(task, r) {
    remindQueue.push({ task: task, r: r });
    pumpRemindQueue();
  }

  function pumpRemindQueue() {
    if (remindPopupOpen || !remindQueue.length) return;
    var item = remindQueue.shift();
    var task = item.task, r = item.r;
    remindPopupOpen = true;
    playRemindSound();
    openModal(function (sheet, rawClose) {
      function close() {
        remindPopupOpen = false;
        rawClose();
        setTimeout(pumpRemindQueue, 120);
      }
      var bell = document.createElement('div');
      bell.className = 'remind-bell';
      bell.innerHTML = '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';
      sheet.appendChild(bell);
      var title = document.createElement('div');
      title.className = 'remind-pop-title';
      title.textContent = '该完成任务了';
      sheet.appendChild(title);
      var name = document.createElement('div');

      });
