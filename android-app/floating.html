<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>快捷面板</title>
<script>
  /* 主题初始化：与主界面保持一致（深浅色 + 主题色） */
  (function () {
    var ACC = { blue: 1, green: 1, violet: 1, orange: 1, red: 1, teal: 1 };
    function applyThemeFromStore() {
      try {
        var t = localStorage.getItem('taskRecordTool.theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        var a = localStorage.getItem('taskRecordTool.accent');
        document.documentElement.setAttribute('data-accent', ACC[a] ? a : 'blue');
      } catch (e) {}
    }
    applyThemeFromStore();
    /* 主界面改色/切深浅时，跨 WebView 实时跟随（部分 ROM 可能不触发，显示面板时再补读一次） */
    window.addEventListener('storage', function (e) {
      if (e.key === 'taskRecordTool.accent' || e.key === 'taskRecordTool.theme') applyThemeFromStore();
    });
    /* 供原生在每次打开面板时主动重读主题 */
    window.__applyPanelTheme = applyThemeFromStore;
  })();
</script>
<style>
  :root {
    --gray: #5c6672;
    --green: #2f9e44;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #212529;
    --muted: #868e96;
    --accent: #339af0;
    --accent-deep: #1c7ed6;
    --danger: #e03131;
    --border: #e9ecef;
    --chip-bg: #f1f3f5;
    --chip-press: #e9ecef;
    --field-bg: #f8f9fa;
    --press-bg: #f8f9fa;
    --divider: #f1f3f5;
    --danger-bg: #fff0f0;
    --toast-bg: rgba(33, 37, 41, .9);
    --toast-text: #fff;
  }
  :root[data-theme="dark"] {
    --bg: #17191c;
    --card: #22262b;
    --text: #e9ecef;
    --muted: #9ba1a9;
    --accent-deep: #1864ab;
    --danger: #ff6b6b;
    --border: #343a40;
    --chip-bg: #2c3136;
    --chip-press: #3a4147;
    --field-bg: #262b30;
    --press-bg: #2c3136;
    --divider: #2c3136;
    --danger-bg: rgba(255, 107, 107, .14);
    --toast-bg: rgba(233, 236, 239, .94);
    --toast-text: #1a1d21;
  }
  :root[data-accent="green"]  { --accent: #40c057; --accent-deep: #2b8a3e; }
  :root[data-accent="violet"] { --accent: #9775fa; --accent-deep: #6741d9; }
  :root[data-accent="orange"] { --accent: #ff922b; --accent-deep: #e8590c; }
  :root[data-accent="red"]    { --accent: #fa5252; --accent-deep: #c92a2a; }
  :root[data-accent="teal"]   { --accent: #38d9a9; --accent-deep: #0ca678; }
  :root[data-theme="dark"][data-accent="green"]  { --accent: #51cf66; --accent-deep: #2f9e44; }
  :root[data-theme="dark"][data-accent="violet"] { --accent: #b197fc; --accent-deep: #7048e8; }
  :root[data-theme="dark"][data-accent="orange"] { --accent: #ffa94d; --accent-deep: #e8590c; }
  :root[data-theme="dark"][data-accent="red"]    { --accent: #ff8787; --accent-deep: #c92a2a; }
  :root[data-theme="dark"][data-accent="teal"]   { --accent: #63e6be; --accent-deep: #0ca678; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: transparent;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  button { font-family: inherit; }

  /* ---------- 面板骨架 ---------- */
  .fp-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 28px rgba(16, 24, 40, .22);
    min-height: 0;
  }
  .fp-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .fp-tab {
    flex: 1;
    border: none;
    background: none;
    padding: 12px 0 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    position: relative;
  }
  .fp-tab.active { color: var(--accent); }
  .fp-tab.active::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 28px;
    height: 3px;
    border-radius: 2px;
    background: var(--accent);
  }
  .fp-body {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px 14px;
    min-height: 0;
  }
  .fp-empty {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    padding: 26px 10px;
  }

  /* ---------- 剪贴板 tab ---------- */
  .fp-snap {
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .fp-snap-label {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .fp-snap-refresh {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 10px;
    cursor: pointer;
    padding: 2px 4px;
  }
  .fp-snap-text {
    font-size: 11px;
    line-height: 1.45;
    word-break: break-all;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    max-height: 82px;
  }
  .fp-snap-text.empty { color: var(--muted); }
  .fp-save-btn {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 12px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .fp-save-btn:active { opacity: .85; }
  .fp-save-btn:disabled { opacity: .5; cursor: default; }
  /* 云同步双按钮：提交 / 同步 */
  .fp-sync-row {
    display: flex;
    gap: 8px;
    margin: 0 0 12px;
  }
  .fp-sync-btn {
    flex: 1 1 0;
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .fp-sync-btn.primary {
    background: var(--accent);
    color: #fff;
  }
  .fp-sync-btn:active { background: var(--chip-bg); }
  .fp-sync-btn.primary:active { opacity: .85; }
  .fp-sync-btn:disabled { opacity: .5; cursor: default; }
  .fp-list-title {
    font-size: 10px;
    color: var(--muted);
    margin: 2px 2px 8px;
  }
  .fp-rec-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 2px;
    border-bottom: 1px solid var(--divider);
    cursor: pointer;
  }
  .fp-rec-item:last-child { border-bottom: none; }
  .fp-rec-item:active { background: var(--press-bg); }
  .fp-rec-text {
    flex: 1;
    font-size: 11px;
    line-height: 1.35;
    word-break: break-all;
    white-space: pre-wrap;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-width: 0;
  }

  /* ---------- 任务 tab ---------- */
  .fp-acc-row { position: relative; margin-bottom: 10px; }
  .fp-acc-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid var(--border);
    background: var(--field-bg);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: left;
  }
  .fp-acc-toggle .caret {
    font-size: 10px;
    color: var(--muted);
    transition: transform .15s ease;
  }
  .fp-acc-toggle.open .caret { transform: rotate(180deg); }
  .fp-acc-pop {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(100% + 4px);
    z-index: 30;
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
    overflow: hidden;
    display: none;
  }
  .fp-acc-pop.show { display: block; }
  .fp-acc-opt {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;
    padding: 11px 12px;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
  }
  .fp-acc-opt:active { background: var(--chip-press); }
  .fp-acc-opt.active { color: var(--accent); font-weight: 700; }
  .fp-cat-name {
    font-size: 10px;
    color: var(--muted);
    margin: 10px 2px 6px;
  }
  .fp-cat-name:first-child { margin-top: 0; }
  .fp-task-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    border: none;
    background: var(--chip-bg);
    border-radius: 12px;
    padding: 11px 12px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
  }
  .fp-task-item:active { background: var(--chip-press); }
  .fp-task-item.unset { opacity: .55; }
  /* 已记录（有次数）的任务项：跟随主题色高亮，与完成状态一致 */
  .fp-task-item.done {
    background: var(--accent);
    border-radius: 10px;
  }
  .fp-task-item.done .fp-task-name,
  .fp-task-item.done .fp-task-sub { color: #fff; }
  .fp-task-item.done .fp-task-count { background: rgba(255,255,255,.28); color: #fff; }
  .fp-task-name {
    flex: 1;
    font-size: 11px;
    font-weight: 600;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .fp-task-sub { font-size: 10px; color: var(--muted); font-weight: 400; display: block; margin-top: 2px; }
  .fp-task-count {
    flex: 0 0 auto;
    min-width: 26px;
    height: 26px;
    border-radius: 13px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 7px;
  }
  .fp-task-count.zero { background: var(--chip-bg); color: var(--muted); }
  .fp-open-app {
    width: 100%;
    border: none;
    border-radius: 10px;
    background: var(--chip-bg);
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
    margin-top: 12px;
  }
  .fp-open-app:active { background: var(--chip-press); }
  .fp-foot {
    text-align: center;
    font-size: 10px;
    color: var(--muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="fp-card">
  <div class="fp-tabs">
    <button type="button" class="fp-tab active" id="tabClip">剪贴板</button>
    <button type="button" class="fp-tab" id="tabTask">任务</button>
  </div>
  <div class="fp-body" id="fpBody"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var STORAGE_KEY = 'taskRecordTool.v1';
  var AUTH_KEY = 'taskRecordTool.auth.v1';
  var API_BASE = 'https://task-record-api.pages.dev';
  var DAY = 86400000;
  var CLIP_EXPIRE_MS = 7 * 24 * 3600 * 1000;

  /* ================= 原生桥 ================= */
  var Native = {
    available: function () { return !!window.AndroidHost; },
    clipSnapshot: function () {
      try { return window.AndroidHost ? (window.AndroidHost.getClipSnapshot() || '') : ''; } catch (e) { return ''; }
    },
    copy: function (text) {
      try { if (window.AndroidHost) { window.AndroidHost.copyText(String(text)); return true; } } catch (e) {}
      return false;
    },
    close: function () {
      try { if (window.AndroidHost) { window.AndroidHost.closePanel(); return true; } } catch (e) {}
      return false;
    },
    toast: function (msg) {
      try { if (window.AndroidHost) { window.AndroidHost.toast(msg); return true; } } catch (e) {}
      return false;
    },
    openMain: function () {
      try { if (window.AndroidHost) { window.AndroidHost.openMain(); return true; } } catch (e) {}
      return false;
    }
  };

  /* ================= 数据层（与主界面共享同一 localStorage） ================= */
  function genId() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && Array.isArray(d.accounts) && d.accounts.length &&
            Array.isArray(d.accounts[0].categories)) {
          if (!Array.isArray(d.clipboards)) d.clipboards = [];
          else d.clipboards = d.clipboards.filter(clipFresh);
          return d;
        }
      }
    } catch (e) {}
    return { activeAccountId: null, accounts: [], clipboards: [] };
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    scheduleSync(800);
  }
  function clipFresh(c) {
    return !!c && typeof c.text === 'string' && (Date.now() - c.at) < CLIP_EXPIRE_MS;
  }
  /* 清理过期记录；并限制总条数（与主界面/网页版一致：60 条），避免整包超过服务端 512KB 上限导致同步失败 */
  var CLIP_KEEP_MAX = 60;
  function pruneClipboards() {
    if (!Array.isArray(data.clipboards)) { data.clipboards = []; return false; }
    var before = data.clipboards.length;
    var list = data.clipboards.filter(clipFresh);
    if (list.length > CLIP_KEEP_MAX) {
      list.sort(function (a, b) { return b.at - a.at; });
      list = list.slice(0, CLIP_KEEP_MAX);
    }
    data.clipboards = list;
    return data.clipboards.length !== before;
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function clipTimeText(at) {
    var d = new Date(at);
    return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '\n' +
           pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ================= 云同步（紧凑版） ================= */
  var auth = (function () {
    try {
      var a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      return (a && a.token && a.username) ? a : null;
    } catch (e) { return null; }
  })();
  var suppressSync = false;
  var syncTimer = null;
  function apiConfigured() { return /^https?:\/\//.test(API_BASE); }
  function saveAuth() {
    try {
      if (auth) localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
      else localStorage.removeItem(AUTH_KEY);
    } catch (e) {}
  }
  function apiFetch(path, opts, token) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    var t = token || (auth && auth.token);
    if (t) headers['Authorization'] = 'Bearer ' + t;
    return fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
  }
  function writeLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }
  /* 剪贴板按 id 求并集（冲突/拉取时避免丢记录），最多保留 60 条 */
  function mergeClipboards(a, b) {
    var map = {};
    (b || []).forEach(function (c) { if (c && c.id) map[c.id] = c; });
    (a || []).forEach(function (c) { if (c && c.id) map[c.id] = c; });
    var out = Object.keys(map).map(function (k) { return map[k]; });
    out.sort(function (x, y) { return y.at - x.at; });
    return out.slice(0, 60);
  }
  function scheduleSync(delay) {
    if (suppressSync) return;
    if (!auth || !apiConfigured()) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { pushData(true); }, delay || 800);
  }
  /* 提交同步：上传本地数据；务必带 base（否则服务端判定冲突 409 直接拒绝）。
     若云端有新写入（409），先拉取并把本地剪贴板并入，再提交一次。 */
  function pushData(quiet) {
    if (!auth || !apiConfigured()) return Promise.resolve({ ok: false, error: '未登录' });
    var localClips = (data.clipboards || []).slice();
    function put() {
      return apiFetch('/api/data', {
        method: 'PUT',
        body: JSON.stringify({ data: data, base: auth.lastSync || null })
      }).then(function (res) {
        if (res.status === 401) { auth = null; saveAuth(); return { ok: false, error: '登录已失效，请到主界面重新登录' }; }
        return res.json().catch(function () { return {}; }).then(function (r) {
          if (res.ok) { auth.lastSync = r.updated_at; saveAuth(); return { ok: true }; }
          if (res.status === 409) return { conflict: true };
          return { ok: false, error: r.error || ('同步失败(' + res.status + ')') };
        });
      });
    }
    return put().then(function (r) {
      if (!r.conflict) return r;
      return pullData(true, true).then(function () {
        data.clipboards = mergeClipboards(localClips, data.clipboards);
        writeLocal();
        return put();
      });
    }).catch(function () { return { ok: false, error: '网络异常，请检查网络' }; });
  }
  /* 拉取：以云端为准覆盖本机，并把本地剪贴板并入（不丢记录） */
  function pullData(quiet, force) {
    if (!auth || !apiConfigured()) return Promise.resolve({ ok: false, error: '未登录' });
    return apiFetch('/api/data').then(function (res) {
      if (res.status === 401) { auth = null; saveAuth(); return { ok: false, error: '登录已失效，请到主界面重新登录' }; }
      return res.json().catch(function () { return {}; }).then(function (r) {
        if (!res.ok) return { ok: false, error: r.error || '拉取失败' };
        var serverAt = r.updated_at || 0;
        var newer = serverAt > (auth.lastSync || 0);
        if (r.data && (force || newer)) {
          var localClips = (data.clipboards || []).slice();
          suppressSync = true;
          data = r.data;
          if (!Array.isArray(data.clipboards)) data.clipboards = [];
          data.clipboards = mergeClipboards(localClips, data.clipboards);
          pruneClipboards();
          if (newer) auth.lastSync = serverAt;
          saveAuth();
          writeLocal();
          suppressSync = false;
          return { ok: true, updated: newer };
        }
        if (newer) { auth.lastSync = serverAt; saveAuth(); }
        return { ok: true, updated: false };
      });
    }).catch(function () { return { ok: false, error: '网络异常，请检查网络' }; });
  }
  /* 轻量探测：只请求版本号，发现云端比本地新才拉全量 */
  function pollMeta() {
    if (!auth || !apiConfigured() || document.hidden) return;
    apiFetch('/api/meta').then(function (res) {
      if (res.status === 401) { auth = null; saveAuth(); return; }
      return res.json().then(function (r) {
        if (res.ok && r.updated_at && r.updated_at > (auth.lastSync || 0)) {
          pullData(true);
        }
      });
    }).catch(function () { /* 离线静默 */ });
  }

  /* ---------- 实时推送（WebSocket）+ 自动降级 ----------
     连的是 pages.dev（非 workers.dev）；不可用时 rtActive=false，回退到 3 秒 meta 轮询 */
  var rtWs = null, rtActive = false, rtRetry = 0, rtRetryTimer = null, rtPingTimer = null;
  function connectRealtime() {
    if (!auth || !apiConfigured()) return;
    if (rtWs && (rtWs.readyState === 0 || rtWs.readyState === 1)) return;
    var url;
    try { url = API_BASE.replace(/^http/, 'ws') + '/api/ws?token=' + encodeURIComponent(auth.token); }
    catch (e) { return; }
    try { rtWs = new WebSocket(url); } catch (e) { scheduleRealtimeRetry(); return; }
    rtWs.onopen = function () {
      rtRetry = 0; rtActive = true;
      if (rtPingTimer) clearInterval(rtPingTimer);
      rtPingTimer = setInterval(function () {
        try { if (rtWs && rtWs.readyState === 1) rtWs.send('{"type":"ping"}'); } catch (e) {}
      }, 25000);
    };
    rtWs.onmessage = function (ev) {
      try {
        var m = JSON.parse(ev.data || '{}');
        if (m && m.type === 'changed') pullData(true).then(function () { render(); });
      } catch (e) {}
    };
    rtWs.onclose = function () {
      rtActive = false;
      if (rtPingTimer) { clearInterval(rtPingTimer); rtPingTimer = null; }
      rtWs = null;
      scheduleRealtimeRetry();
    };
    rtWs.onerror = function () { /* 交由 onclose 处理 */ };
  }
  function scheduleRealtimeRetry() {
    if (rtRetryTimer) clearTimeout(rtRetryTimer);
    var delay = Math.min(30000, 1000 * Math.pow(2, Math.min(rtRetry, 5)));
    rtRetry++;
    rtRetryTimer = setTimeout(connectRealtime, delay);
  }

  /* ================= 周期逻辑（与主界面一致） ================= */
  function startOfDay(ts) { var d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }
  function resetAt(task) { return startOfDay(task.cycleStart) + Math.max(1, task.cycleDays || 1) * DAY; }
  function remainLabel(task) {
    var left = resetAt(task) - Date.now();
    if (left <= 0) return '已到期';
    var days = Math.floor(left / DAY);
    var hours = Math.floor((left % DAY) / 3600000);
    return days > 0 ? days + ' 天后清零' : hours + ' 小时后清零';
  }
  function isDone(task) { return task.configured && task.count > 0; }
  function bumpTask(task) {
    var now = Date.now();
    if (task.cycleStart === 0 || now >= resetAt(task)) {
      task.cycleStart = now;
      task.count = 1;
    } else {
      task.count += 1;
    }
  }

  /* ================= 系统提醒同步（周期起点变化时重排原生闹钟） ================= */
  /* 悬浮面板只改计数，不改提醒规则；这里按与主界面相同的语义计算 nextAt 全量下发，
     让 AlarmManager 与主界面保持一致（主界面打开时会再次全量校准） */
  function parseTime(str) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(str || ''));
    if (!m) return null;
    var hh = +m[1], mm = +m[2];
    if (hh > 23 || mm > 59) return null;
    return { hh: hh, mm: mm };
  }
  function nextOccurrence(r, task, fromTs) {
    if (r.repeat === 'date') {
      var parts = String(r.date || '').split('-');
      if (parts.length !== 3) return null;
      var d = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      var p = parseTime(r.time);
      if (!p) return null;
      d.setHours(p.hh, p.mm, 0, 0);
      return d.getTime() >= fromTs ? d.getTime() : null;
    }
    if (r.repeat === 'cycle') {
      var N = Math.max(1, task.cycleDays || 1);
      var base = startOfDay(task.cycleStart || fromTs);
      var pp = parseTime(r.time);
      if (!pp) return null;
      var k = 0, occ;
      do {
        occ = new Date(base + k * N * DAY);
        occ.setHours(pp.hh, pp.mm, 0, 0);
        k++;
      } while (occ.getTime() < fromTs && k < 4000);
      return occ.getTime() >= fromTs ? occ.getTime() : null;
    }
    var day = startOfDay(fromTs);
    for (var i = 0; i < 400; i++) {
      var d2 = new Date(day + i * DAY);
      d2.setHours(0, 0, 0, 0);
      if (r.repeat === 'weekly' && (r.days || []).indexOf(d2.getDay()) === -1) continue;
      var q = parseTime(r.time);
      if (!q) return null;
      d2.setHours(q.hh, q.mm, 0, 0);
      if (d2.getTime() >= fromTs) return d2.getTime();
    }
    return null;
  }
  function syncRemindersToNative() {
    if (!Native.available()) return;
    try {
      var out = [];
      data.accounts.forEach(function (acc) {
        acc.categories.forEach(function (cat) {
          cat.tasks.forEach(function (t) {
            if (!t.configured) return;
            (t.reminders || []).forEach(function (r) {
              if (r.enabled === false) return;
              out.push({
                id: r.id, taskId: t.id, taskName: t.name,
                accName: acc.name, catName: cat.name,
                time: r.time, repeat: r.repeat, days: (r.days || []).slice(),
                date: r.date || '', cycleDays: Math.max(1, t.cycleDays || 1),
                cycleStart: t.cycleStart || 0,
                nextAt: nextOccurrence(r, t, Date.now()) || 0, enabled: true
              });
            });
          });
        });
      });
      window.AndroidHost.syncReminders(JSON.stringify(out));
    } catch (e) {}
  }

  var data = loadData();

  /* ================= 视图状态 ================= */
  var uiTab = 'clip';                 /* clip | task */
  var viewAccountId = data.activeAccountId || (data.accounts[0] && data.accounts[0].id) || null;

  var body = document.getElementById('fpBody');
  var tabClip = document.getElementById('tabClip');
  var tabTask = document.getElementById('tabTask');

  function toast(msg) {
    if (Native.toast(msg)) return;
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);' +
      'background:var(--toast-bg);color:var(--toast-text);font-size: 10px;padding:8px 14px;' +
      'border-radius:8px;z-index:99;';
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 1800);
  }

  /* 复制文本；返回是否成功（供调用方决定后续动作） */
  function copyText(text, okMsg) {
    if (Native.copy(text)) { toast(okMsg || '已复制'); return true; }
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-999px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? (okMsg || '已复制') : '复制失败');
    return ok;
  }

  /* ================= 剪贴板 tab ================= */
  function renderClipTab() {
    body.innerHTML = '';

    /* 不再显示「当前剪贴板」快照框（该框无输入功能）：内容由「提交」按钮直接读取系统剪贴板 */

    /* 两个动作按钮：提交（把最近一条剪贴板保存到记录并提交云端）/ 同步（从云端拉取最新数据） */
    var actRow = document.createElement('div');
    actRow.className = 'fp-sync-row';
    var submitBtn = document.createElement('button');
    submitBtn.type = 'button';
    submitBtn.className = 'fp-sync-btn primary';
    submitBtn.textContent = '提交';
    submitBtn.addEventListener('click', function () {
      var text = Native.clipSnapshot().trim();
      if (!text) { toast('剪贴板为空或非文本内容'); return; }
      pruneClipboards();
      data.clipboards.unshift({ id: genId(), text: text, at: Date.now() });
      writeLocal(); /* 先落到本机记录 */
      if (!auth || !apiConfigured()) { toast('已保存到记录（未登录，仅存本机）'); render(); return; }
      submitBtn.disabled = true;
      toast('已保存，正在提交…');
      pushData(false).then(function (r) {
        toast(r.ok ? '已保存并提交到云端' : (r.error || '提交失败'));
        render();
      });
    });
    actRow.appendChild(submitBtn);
    var syncBtn = document.createElement('button');
    syncBtn.type = 'button';
    syncBtn.className = 'fp-sync-btn';
    syncBtn.textContent = '同步';
    syncBtn.addEventListener('click', function () {
      if (!auth || !apiConfigured()) { toast('请先到主界面登录账号'); return; }
      syncBtn.disabled = true;
      pullData(false, true).then(function (r) {
        toast(r.ok ? (r.updated ? '已同步最新记录' : '已是最新') : (r.error || '同步失败'));
        render();
      });
    });
    actRow.appendChild(syncBtn);
    body.appendChild(actRow);

    /* 记录列表 */
    var title = document.createElement('div');
    title.className = 'fp-list-title';
    if (pruneClipboards()) writeLocal(); /* 裁剪后落盘，保持与云端一致 */
    title.textContent = '保存的记录（' + data.clipboards.length + ' 条，点击复制）';
    body.appendChild(title);

    if (!data.clipboards.length) {
      var empty = document.createElement('div');
      empty.className = 'fp-empty';
      empty.textContent = '暂无记录';
      body.appendChild(empty);
      return;
    }
    var items = data.clipboards.slice().sort(function (a, b) { return b.at - a.at; }).slice(0, 30);
    items.forEach(function (c) {
      var row = document.createElement('div');
      row.className = 'fp-rec-item';
      var txt = document.createElement('span');
      txt.className = 'fp-rec-text';
      txt.textContent = c.text;
      row.appendChild(txt);
      /* 点击记录：复制内容 → 提示「复制成功」→ 自动收起面板 */
      row.addEventListener('click', function () {
        var ok = copyText(c.text, '复制成功');
        if (ok) setTimeout(function () { Native.close(); }, 150);
      });
      body.appendChild(row);
    });
  }

  /* ================= 任务 tab ================= */
  function renderTaskTab() {
    body.innerHTML = '';

    if (!data.accounts.length) {
      var empty = document.createElement('div');
      empty.className = 'fp-empty';
      empty.textContent = '暂无任务，请先打开主界面添加';
      body.appendChild(empty);
      return;
    }

    /* 账号下拉栏（自定义，支持再次点击收起） */
    var accRow = document.createElement('div');
    accRow.className = 'fp-acc-row';
    var toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'fp-acc-toggle';
    var tName = document.createElement('span');
    tName.textContent = (data.accounts.filter(function (a) { return a.id === viewAccountId; })[0] || data.accounts[0]).name;
    var caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = '▾';
    toggle.appendChild(tName);
    toggle.appendChild(caret);
    var pop = document.createElement('div');
    pop.className = 'fp-acc-pop';
    data.accounts.forEach(function (a) {
      var opt = document.createElement('button');
      opt.type = 'button';
      opt.className = 'fp-acc-opt' + (a.id === viewAccountId ? ' active' : '');
      opt.textContent = a.name;
      opt.addEventListener('click', function (e) {
        e.stopPropagation();
        viewAccountId = a.id;
        render();
      });
      pop.appendChild(opt);
    });
    accRow.appendChild(toggle);
    accRow.appendChild(pop);
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = pop.classList.toggle('show');
      toggle.classList.toggle('open', open);
    });
    body.appendChild(accRow);

    var acc = data.accounts.filter(function (a) { return a.id === viewAccountId; })[0] || data.accounts[0];
    viewAccountId = acc.id;

    var anyTask = false;
    (acc.categories || []).forEach(function (cat) {
      var tasks = (cat.tasks || []).filter(function (t) { return t.configured; });
      if (!tasks.length) return;
      anyTask = true;
      var catName = document.createElement('div');
      catName.className = 'fp-cat-name';
      catName.textContent = cat.name;
      body.appendChild(catName);
      tasks.forEach(function (t) {
        var row = document.createElement('button');
        row.type = 'button';
        row.className = 'fp-task-item' + (t.count > 0 ? ' done' : '');
        var nameWrap = document.createElement('span');
        nameWrap.className = 'fp-task-name';
        nameWrap.textContent = t.name;
        var sub = document.createElement('span');
        sub.className = 'fp-task-sub';
        sub.textContent = remainLabel(t);
        nameWrap.appendChild(sub);
        var count = document.createElement('span');
        count.className = 'fp-task-count' + (t.count > 0 ? '' : ' zero');
        count.textContent = String(t.count);
        row.appendChild(nameWrap);
        row.appendChild(count);
        row.addEventListener('click', function () {
          bumpTask(t);
          save();
          render();
          syncRemindersToNative(); /* 周期起点可能变化：重排系统闹钟 */
        });
        body.appendChild(row);
      });
    });

    if (!anyTask) {
      var empty2 = document.createElement('div');
      empty2.className = 'fp-empty';
      empty2.textContent = '该账号下还没有已设置的任务';
      body.appendChild(empty2);
      return;
    }

    /* 打开主界面 */
    var openBtn = document.createElement('button');
    openBtn.type = 'button';
    openBtn.className = 'fp-open-app';
    openBtn.textContent = '打开主界面';
    openBtn.addEventListener('click', function () { Native.openMain(); });
    body.appendChild(openBtn);

    var foot = document.createElement('div');
    foot.className = 'fp-foot';
    foot.textContent = '点击任务即记录一次完成';
    body.appendChild(foot);
  }

  /* ================= 渲染与切换 ================= */
  function render() {
    tabClip.classList.toggle('active', uiTab === 'clip');
    tabTask.classList.toggle('active', uiTab === 'task');
    if (uiTab === 'clip') renderClipTab();
    else renderTaskTab();
  }
  tabClip.addEventListener('click', function () { uiTab = 'clip'; render(); });
  tabTask.addEventListener('click', function () { uiTab = 'task'; render(); });

  /* 页面每次显示（面板重新打开）时刷新数据 */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      data = loadData();
      render();
      syncRemindersToNative(); /* 主界面可能改过提醒/周期：校准系统闹钟 */
      pollMeta(); /* 面板打开即探测一次云端是否有更新 */
      connectRealtime(); /* 确保实时推送连接在线 */
    }
  });

  /* 面板可见时探测（3s）：仅在 WebSocket 不可用时兜底；面板关闭后 document.hidden=true 自动停 */
  setInterval(function () {
    if (rtActive || document.hidden) return;
    pollMeta();
  }, 3000);

  render();
  syncRemindersToNative(); /* 面板打开即校准一次 */
  pollMeta(); /* 打开面板即探测一次 */
  connectRealtime(); /* 建立实时推送长连接（失败自动降级为轮询） */
})();
</script>
</body>
</html>
