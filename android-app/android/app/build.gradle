plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.taskrecord.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.taskrecord.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        /* 本地调试签名：用 keytool 生成的 debug.keystore 放入 app/ 目录即可；
           未放置时自动退回到 Android 默认调试签名 */
        release {
            if (rootProject.file('app/debug.keystore').exists()) {
                storeFile rootProject.file('app/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('app/debug.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    /* 已按需求取消 assets 离线快照：APK 只加载 GitHub Pages 在线文档，
       改网页内容无需重新打包；断网时页面打不开属预期行为。
       注意：不要再恢复「构建时把 html 拷进 assets」的 syncAssets 任务，
       否则 APK 会重新内置一份快照，与「强制在线」的需求冲突。 */
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
