plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.taskrecord.app'
    compileSdk 34

    defaultConfig {
        applicationId "cn.taskrecord.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        /* 本地调试签名：用 keytool 生成的 debug.keystore 放入 app/ 目录即可；
           未放置时自动退回到 Android 默认调试签名 */
        release {
            if (rootProject.file('app/debug.keystore').exists()) {
                storeFile rootProject.file('app/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('app/debug.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    /* 构建前把仓库根目录的线上文档快照进 assets，保证 APK 离线回退与线上一致 */
    task syncAssets {
        doLast {
            def src = rootProject.file('../app.html')
            def src2 = rootProject.file('../floating.html')
            def dstDir = file('src/main/assets')
            dstDir.mkdirs()
            if (src.exists()) {
                copy { from src; into dstDir }
                println '[syncAssets] app.html -> ' + dstDir
            } else {
                println '[syncAssets] WARN 未找到 ../app.html'
            }
            if (src2.exists()) {
                copy { from src2; into dstDir }
                println '[syncAssets] floating.html -> ' + dstDir
            } else {
                println '[syncAssets] WARN 未找到 ../floating.html'
            }
        }
    }
    preBuild.dependsOn syncAssets
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
